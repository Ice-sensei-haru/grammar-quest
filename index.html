<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>英語処理OS RPG - extra STAGE</title>
<style>
  body {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background-color: #1a1a2e;
    color: #e0e0e0;
    margin: 0;
    padding: 20px;
  }
  .container {
    max-width: 700px;
    margin: 0 auto;
    background: #16213e;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  }
  h1, h2, h3 {
    color: #00fff5;
  }
  .status-bar {
    display: flex;
    justify-content: space-between;
    background: #0f3460;
    padding: 10px 15px;
    border-radius: 5px;
    margin-bottom: 20px;
  }
  .btn {
    background-color: #e94560;
    color: white;
    border: none;
    padding: 12px 20px;
    font-size: 16px;
    border-radius: 5px;
    cursor: pointer;
    margin-top: 10px;
    width: 100%;
  }
  .btn:hover {
    background-color: #ff6b81;
  }
  .btn:disabled {
    background-color: #555;
    cursor: not-allowed;
  }
  .option-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: #0f3460;
    color: #fff;
    border: 1px solid #00fff5;
    padding: 10px;
    margin: 8px 0;
    border-radius: 5px;
    cursor: pointer;
  }
  .option-btn:hover {
    background: #1f4068;
  }
  .skill-badge {
    display: inline-block;
    background: #00fff5;
    color: #1a1a2e;
    font-weight: bold;
    padding: 5px 10px;
    border-radius: 3px;
    margin-top: 5px;
  }
  .hidden {
    display: none;
  }
</style>
</head>
<body>

<div class="container">
  <!-- ステータス表示 -->
  <div class="status-bar">
    <div>STAGE: <span id="display-stage">9</span></div>
    <div>EXP: <span id="display-exp">1300</span></div>
  </div>

  <!-- ステージ選択 / 進行制御画面 -->
  <div id="stage-select-screen">
    <h2>ステージ選択</h2>
    <p id="lock-message" style="color: #ff6b81;"></p>
    
    <button class="btn" id="btn-extra-stage" onclick="startExtraStage()">
      上位スキル進化STAGE (extra STAGE) に挑戦
    </button>

    <button class="btn" id="btn-stage10" disabled onclick="alert('STAGE 10 開始！')">
      STAGE 10 （extra STAGEクリアで開放）
    </button>
  </div>

  <!-- extra STAGE 実行画面 -->
  <div id="extra-stage-screen" class="hidden">
    <div id="badge-area"></div>
    <h2 id="q-title">上位スキル進化STAGE</h2>
    <p id="q-text" style="white-space: pre-wrap; line-height: 1.6;"></p>
    <div id="options-container"></div>
    <div id="feedback" style="margin-top: 15px; font-weight: bold;"></div>
  </div>
</div>

<script>
// ==========================================
// ゲーム状態管理
// ==========================================
let gameState = {
  currentStage: 9,
  exp: 1300,
  isExtraStageUnlocked: true, // STAGE9クリア & EXP1300到達でtrue
  isExtraStageCleared: false,
  skills: []
};

// ==========================================
// extra STAGE 問題データ定義
// ==========================================
const extraStageQuestions = [
  // ［2］問題 ①〜⑩
  {
    id: 1,
    title: "［2］問題 ① (+20EXP)",
    text: "① ( lunch / and Lisa / cafeteria / have / Tom / at / always / the ).\nこの英文を完成させるときの手順を並べかえなさい。\n\nア：追加の情報を組み立てる\nイ：主語と動詞の組み合わせを見つける\nウ：動詞の後ろの目的語や補語を見つける\nエ：文全体を整える\nオ：文の形を確認する",
    options: [
      { label: "イ → オ → ウ → ア → エ", isCorrect: true },
      { label: "オ → イ → ウ → ア → エ", isCorrect: false },
      { label: "イ → ウ → オ → ア → エ", isCorrect: false }
    ]
  },
  {
    id: 2,
    title: "［2］問題 ② (+20EXP)",
    text: "② They ate lunch yesterday. の文に使われている表現は？",
    options: [
      { label: "A : 現在形", isCorrect: false },
      { label: "B : 過去形", isCorrect: true },
      { label: "C : 進行形", isCorrect: false }
    ]
  },
  {
    id: 3,
    title: "［2］問題 ③ (+20EXP)",
    text: "③ Lunch was eaten by Tom. の文に使われている表現は？",
    options: [
      { label: "A : 進行形", isCorrect: false },
      { label: "B : 完了形", isCorrect: false },
      { label: "C : 受動態", isCorrect: true }
    ]
  },
  {
    id: 4,
    title: "［2］問題 ④ (+20EXP)",
    text: "④ Tom has just eaten lunch. の文に使われている表現は？",
    options: [
      { label: "A : 進行形", isCorrect: false },
      { label: "B : 完了形", isCorrect: true },
      { label: "C : 受動態", isCorrect: false }
    ]
  },
  {
    id: 5,
    title: "［2］問題 ⑤ (+20EXP)",
    text: "⑤ He is in the library. に「～に違いない」という表現を加えるときは？",
    options: [
      { label: "A : mustを使って動詞を原形のbeにする", isCorrect: true },
      { label: "B : mayを使って動詞はisのままにする", isCorrect: false },
      { label: "C : shouldを使って動詞を原形のbeにする", isCorrect: false }
    ]
  },
  {
    id: 6,
    title: "［2］問題 ⑥ (+20EXP)",
    text: "⑥ 相手に提案する表現でないものは？",
    options: [
      { label: "A : Why don’t we go skiing?", isCorrect: false },
      { label: "B : Shall we have dinner?", isCorrect: false },
      { label: "C : Can I have your name?", isCorrect: true }
    ]
  },
  {
    id: 7,
    title: "［2］問題 ⑦ (+20EXP)",
    text: "⑦ Tom took these pictures. を受動態にするとき、その手順を並べ替えなさい。\n\nア：by＋もとの行為者を加える\nイ：be動詞を主語と時制で区別する\nウ：目的語を主語にする\nエ：もとの文の動詞を過去分詞にする\nオ：もとの文の動詞を見て、時制を決める",
    options: [
      { label: "ウ → オ → イ → エ → ア", isCorrect: true },
      { label: "オ → ウ → イ → エ → ア", isCorrect: false },
      { label: "ウ → イ → オ → エ → ア", isCorrect: false }
    ]
  },
  {
    id: 8,
    title: "［2］問題 ⑧ (+20EXP)",
    text: "⑧ Tom has been to Kyoto two years ago. の間違いを訂正すると？",
    options: [
      { label: "A : hasがhad", isCorrect: false },
      { label: "B : has beenがwent", isCorrect: true },
      { label: "C : been toがgone to", isCorrect: false }
    ]
  },
  {
    id: 9,
    title: "［2］問題 ⑨ (+20EXP)",
    text: "⑨ I remember ( see ) Ken last year. の( )の語を正しい語にするときの判断は？",
    options: [
      { label: "A : rememberの後ろで、last yearがある", isCorrect: true },
      { label: "B : rememberの後ろで、Kenがある", isCorrect: false },
      { label: "C : rememberが現在形", isCorrect: false }
    ]
  },
  {
    id: 10,
    title: "［2］問題 ⑩ (+20EXP)",
    text: "⑩ Tom is taller than Ken. とほぼ同じ意味になる文は？",
    options: [
      { label: "A : Ken is as short as Tom.", isCorrect: false },
      { label: "B : Ken is less short than Tom.", isCorrect: false },
      { label: "C : Ken is not as tall as Tom.", isCorrect: true }
    ]
  },
  // ［3］BOSS BATTLE
  {
    id: 11,
    title: "［3］BOSS BATTLE （次のSTAGE開放試練）",
    text: "How is the weather in London? の文末にtomorrowを加えた文にするとき、正しい判断はどれか？",
    options: [
      { label: "A : 未来 → will + 動詞の原形 → 疑問文は主語の前にwillを出す", isCorrect: true },
      { label: "B : 未来 → willを使う → 主語の後にwillを置く", isCorrect: false },
      { label: "C : 未来 → will beを使う → 主語の前に置く", isCorrect: false }
    ]
  }
];

let currentQuestionIndex = 0;

// ==========================================
// 画面制御・更新関数
// ==========================================
function updateUI() {
  document.getElementById('display-stage').textContent = gameState.currentStage;
  document.getElementById('display-exp').textContent = gameState.exp;

  const btnExtra = document.getElementById('btn-extra-stage');
  const btnStage10 = document.getElementById('btn-stage10');
  const lockMsg = document.getElementById('lock-message');

  // 条件チェック: STAGE9クリア 且つ EXP 1300 以上
  const canAccessExtra = (gameState.currentStage >= 9 && gameState.exp >= 1300);

  if (!canAccessExtra) {
    btnExtra.disabled = true;
    lockMsg.textContent = "※STAGE9をクリアし、EXPが1300点に達するとextra STAGEが開放されます。";
  } else {
    btnExtra.disabled = false;
    lockMsg.textContent = "";
  }

  // STAGE10解放フラグ
  if (gameState.isExtraStageCleared) {
    btnStage10.disabled = false;
    btnStage10.textContent = "STAGE 10 （開放中）";
  } else {
    btnStage10.disabled = true;
    btnStage10.textContent = "STAGE 10 （extra STAGEクリアで開放）";
  }
}

function startExtraStage() {
  document.getElementById('stage-select-screen').classList.add('hidden');
  document.getElementById('extra-stage-screen').classList.remove('hidden');
  currentQuestionIndex = 0;
  showQuestion();
}

function showQuestion() {
  const q = extraStageQuestions[currentQuestionIndex];
  document.getElementById('q-title').textContent = q.title;
  document.getElementById('q-text').textContent = q.text;
  document.getElementById('feedback').textContent = "";

  // ［1］獲得スキル目標の表示
  const badgeArea = document.getElementById('badge-area');
  badgeArea.innerHTML = `<span class="skill-badge">［1］獲得対象スキル：処理手順化スキル</span>`;

  const optionsContainer = document.getElementById('options-container');
  optionsContainer.innerHTML = "";

  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt.label;
    btn.onclick = () => checkAnswer(opt.isCorrect);
    optionsContainer.appendChild(btn);
  });
}

function checkAnswer(isCorrect) {
  const feedback = document.getElementById('feedback');
  if (isCorrect) {
    feedback.style.color = "#00fff5";
    
    // ①〜⑩の問題（BOSS以外）は +20EXP
    if (currentQuestionIndex < 10) {
      gameState.exp += 20;
      feedback.textContent = "正解！ +20EXP 獲得！";
    } else {
      feedback.textContent = "BOSS BATTLE 撃破！";
    }
    
    updateUI();

    setTimeout(() => {
      currentQuestionIndex++;
      if (currentQuestionIndex < extraStageQuestions.length) {
        showQuestion();
      } else {
        finishExtraStage();
      }
    }, 1200);

  } else {
    feedback.style.color = "#ff6b81";
    feedback.textContent = "不正解！ 手順や判断を見直して再挑戦しよう。";
  }
}

function finishExtraStage() {
  gameState.isExtraStageCleared = true;
  if (!gameState.skills.includes("処理手順化スキル")) {
    gameState.skills.push("処理手順化スキル");
  }

  alert("CLEAR！\n『処理手順化スキル』を獲得しました！\n次のSTAGEの扉が開放されました！");

  // 選択画面に戻す
  document.getElementById('extra-stage-screen').classList.add('hidden');
  document.getElementById('stage-select-screen').classList.remove('hidden');
  updateUI();
}

// 初期実行
updateUI();
</script>

</body>
</html>
