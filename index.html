<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英語処理OS RPG - English Build Up Training</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --text-color: #c9d1d9;
      --accent-color: #58a6ff;
      --success-color: #2ea043;
      --danger-color: #da3633;
      --gold-color: #d29922;
      --purple-color: #a371f7;
    }
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      margin: 0;
      padding: 15px;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    #app {
      width: 100%;
      max-width: 650px;
      background: var(--card-bg);
      border: 3px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 12px;
      margin-bottom: 15px;
    }
    .title {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--accent-color);
    }
    .player-stats {
      text-align: right;
    }
    .exp-bar-container {
      width: 140px;
      height: 12px;
      background: #21262d;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      margin-top: 4px;
    }
    .exp-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #238636, #2ea043);
      transition: width 0.3s ease;
    }
    .skills-container {
      background: #0d1117;
      border: 1px dashed var(--border-color);
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 0.85rem;
    }
    .skill-badge {
      display: inline-block;
      background: #232830;
      color: var(--gold-color);
      border: 1px solid var(--gold-color);
      padding: 2px 8px;
      border-radius: 4px;
      margin: 2px;
      font-weight: bold;
    }
    .card {
      background: #0d1117;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
    }
    .card-header {
      font-weight: bold;
      color: var(--accent-color);
      margin-bottom: 10px;
      font-size: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .question-text {
      font-size: 1.1rem;
      margin-bottom: 15px;
      line-height: 1.5;
      color: #ffffff;
      background: #161b22;
      padding: 12px;
      border-radius: 6px;
      border-left: 4px solid var(--accent-color);
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn {
      background: #21262d;
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 12px 15px;
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
      line-height: 1.4;
    }
    .btn:hover:not(:disabled) {
      background: #30363d;
      border-color: var(--accent-color);
    }
    .btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }
    .btn.correct {
      background: #1b4721 !important;
      border-color: var(--success-color) !important;
      color: #ffffff;
    }
    .btn.wrong {
      background: #671618 !important;
      border-color: var(--danger-color) !important;
      color: #ffffff;
    }
    .feedback {
      margin-top: 15px;
      padding: 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      line-height: 1.4;
      display: none;
    }
    .feedback.active {
      display: block;
    }
    .feedback.wrong-fb {
      background: rgba(218, 54, 51, 0.15);
      border: 1px solid var(--danger-color);
      color: #ff7b72;
    }
    .feedback.correct-fb {
      background: rgba(46, 160, 67, 0.15);
      border: 1px solid var(--success-color);
      color: #56d364;
    }
    .boss-card {
      border: 2px solid var(--danger-color);
      background: linear-gradient(180deg, #200a0a 0%, #0d1117 100%);
    }
    .boss-header {
      color: var(--danger-color);
      font-weight: bold;
      text-align: center;
      font-size: 1.2rem;
      letter-spacing: 2px;
    }
    .reset-btn {
      background: transparent;
      color: #8b949e;
      border: 1px solid #30363d;
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
    }
    .reset-btn:hover {
      color: var(--danger-color);
      border-color: var(--danger-color);
    }
    .stage-select-btn {
      background: #21262d;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 8px;
      width: 100%;
      text-align: left;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .stage-select-btn:hover:not(:disabled) {
      border-color: var(--accent-color);
    }
    .stage-select-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .stage-select-btn.extra-stage-btn {
      border-color: var(--purple-color);
      background: linear-gradient(135deg, #181124 0%, #21262d 100%);
    }
    .stage-select-btn.extra-stage-btn:hover:not(:disabled) {
      border-color: #c084fc;
    }
    .stage-select-btn.battle-mode-btn {
      border-color: var(--danger-color);
      background: linear-gradient(135deg, #2d1111 0%, #21262d 100%);
    }
    .battle-scene {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: #090d12;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      text-align: center;
    }
    .pixel-char {
      font-size: 2.5rem;
      animation: floatChar 2s ease-in-out infinite;
    }
    @keyframes floatChar {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    .monster-char {
      font-size: 2.5rem;
      animation: pulseMonster 1.5s ease-in-out infinite;
    }
    @keyframes pulseMonster {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    .endroll-card {
    text-align: center;
    padding: 30px 20px;
    background: linear-gradient(135deg, #161b22 0%, #1f2633 100%);
    border: 2px solid var(--gold-color);
    border-radius: 12px;
    min-height: 420px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .endroll-skill {
    font-size: 1.15rem;
    color: var(--gold-color);
    font-weight: bold;
    margin: 10px 0;
    animation: endrollIn 0.6s ease both;
  }
  @keyframes endrollIn {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .endroll-final {
    animation: endrollFinal 1s ease both;
  }
  @keyframes endrollFinal {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
  }
  .all-clear-card {
      text-align: center;
      padding: 30px 20px;
      background: linear-gradient(135deg, #161b22 0%, #1f2633 100%);
      border: 2px solid var(--gold-color);
      border-radius: 12px;
    }
    .trophy-icon {
      font-size: 4rem;
      margin-bottom: 15px;
      animation: bounceTrophy 1s ease-in-out infinite alternate;
    }
    @keyframes bounceTrophy {
      0% { transform: translateY(0); }
      100% { transform: translateY(-10px); }
    }
    /* 並べ替えUI専用スタイル */
    .word-pool, .word-answer-box {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 48px;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 12px;
    }
    .word-answer-box {
      background: #161b22;
      border: 2px dashed var(--accent-color);
      align-items: center;
    }
    .word-pool {
      background: #0d1117;
      border: 1px solid var(--border-color);
    }
    .word-chip {
      background: #21262d;
      color: #ffffff;
      border: 1px solid var(--accent-color);
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .word-chip:hover {
      background: var(--accent-color);
      color: #0d1117;
      font-weight: bold;
    }
    .sort-action-btn {
      background: var(--success-color);
      color: #ffffff;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .sort-action-btn:disabled {
      background: #30363d;
      cursor: not-allowed;
      opacity: 0.6;
    }
    /* バトルモード用CSS */
    .timer-display {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--danger-color);
      text-align: center;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }
    .highlight-red {
      color: #ff5555;
      font-weight: bold;
      text-decoration: underline;
    }
    .skill-comment-box {
      background: rgba(210, 153, 34, 0.15);
      border: 1px solid var(--gold-color);
      color: var(--gold-color);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      margin-bottom: 12px;
      font-weight: bold;
    }
    .dialog-overlay {
      background: rgba(0, 0, 0, 0.8);
      border: 2px solid var(--gold-color);
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      margin-top: 15px;
    }
    .dialog-btns {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 15px;
    }
    .dialog-btn {
      padding: 10px 25px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      border: none;
    }
    .dialog-btn-yes {
      background: var(--success-color);
      color: white;
    }
    .dialog-btn-no {
      background: var(--danger-color);
      color: white;
    }
  </style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="title">⚔ 英語処理OS Build Up</div>
    <div class="player-stats">
      <div style="font-size: 0.85rem;">ランク: <span id="rank-display" style="color:var(--gold-color); font-weight:bold;">1</span> (EXP: <span id="exp-display">0</span>)</div>
      <div class="exp-bar-container">
        <div id="exp-bar" class="exp-bar"></div>
      </div>
      <div style="font-size:0.7rem; color:#8b949e; margin-top:2px;">💾 進捗は自動保存されます</div>
    </div>
  </div>
  <div class="skills-container">
    <div style="font-size: 0.75rem; color: #8b949e; margin-bottom: 4px; display:flex; justify-content:space-between; align-items:center;">
      <span>獲得した判断の眼 (<span id="skill-count">0</span>個)</span>
      <button class="reset-btn" onclick="confirmResetData()">データ削除</button>
    </div>
    <div id="skills-list">
      <span style="color: #484f58; font-size: 0.8rem;">まだ判断の眼を獲得していません</span>
    </div>
  </div>
  <div id="main-content"></div>
</div>
<script>
// 動詞操作判定バトルモードの全20問データ
const VERB_BATTLE_QUESTIONS = [

  { id: 5, text: "Who (  ) the bike?", options: [{ label: "A：uses", correct: true }, { label: "B：does use", correct: false }], highlightText: "Who", comment: "疑問詞が主語" },
  { id: 6, text: "When was the temple (  )?", options: [{ label: "A：built", correct: true }, { label: "B：building", correct: false }], highlightText: "the temple", comment: "主語が動作を受ける側" },

  { id: 9, text: "(  ) your sister tired then?", options: [{ label: "A：Did", correct: false }, { label: "B：Was", correct: true }], highlightText: "tired", comment: "一般動詞がない" },

let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (AudioContext) {
      audioCtx = new AudioContext();
    }
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}
function playSound(type) {
  initAudio();
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  if (type === 'correct') {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(523.25, now);
    osc.frequency.setValueAtTime(659.25, now + 0.1);
    gain.gain.setValueAtTime(0.1, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
    osc.start(now);
    osc.stop(now + 0.3);
  } else if (type === 'wrong') {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(196.00, now);
    osc.frequency.setValueAtTime(146.83, now + 0.15);
    gain.gain.setValueAtTime(0.1, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
    osc.start(now);
    osc.stop(now + 0.35);
  } else if (type === 'levelup') {
    const notes = [
      { freq: 440.00, dur: 0.1 },
      { freq: 554.37, dur: 0.1 },
      { freq: 659.25, dur: 0.1 },
      { freq: 880.00, dur: 0.35 }
    ];
    let startTime = now;
    notes.forEach(note => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'square';
      osc.frequency.setValueAtTime(note.freq, startTime);
      gain.gain.setValueAtTime(0.12, startTime);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + note.dur);
      osc.start(startTime);
      osc.stop(startTime + note.dur);
      startTime += note.dur;
    });
  } else if (type === 'clear') {
    const notes = [
      { freq: 523.25, dur: 0.12 },
      { freq: 659.25, dur: 0.12 },
      { freq: 783.99, dur: 0.12 },
      { freq: 1046.50, dur: 0.4 }
    ];
    let startTime = now;
    notes.forEach(note => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(note.freq, startTime);
      gain.gain.setValueAtTime(0.15, startTime);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + note.dur);
      osc.start(startTime);
      osc.stop(startTime + note.dur);
      startTime += note.dur;
    });
  }
}

function addExp(amount) {
  const oldRank = Math.floor(gameState.exp / 100) + 1;
  gameState.exp += amount;
  const newRank = Math.floor(gameState.exp / 100) + 1;
  if (newRank > oldRank) {
    playSound('levelup');
  }
}
function getRank(exp) {
  return Math.floor(exp / 100) + 1;
}
function updateHeader() {
  const rank = getRank(gameState.exp);
  document.getElementById('rank-display').textContent = rank;
  document.getElementById('exp-display').textContent = gameState.exp;
  
  const currentLevelExp = gameState.exp % 100;
  document.getElementById('exp-bar').style.width = currentLevelExp + '%';
  const skillContainer = document.getElementById('skills-list');
  document.getElementById('skill-count').textContent = gameState.unlockedSkills.length;
  
  if (gameState.unlockedSkills.length === 0) {
    skillContainer.innerHTML = '<span style="color: #484f58; font-size: 0.8rem;">まだ判断の眼を獲得していません</span>';
  } else {
    skillContainer.innerHTML = gameState.unlockedSkills.map(s => `<span class="skill-badge">🛡 ${s}</span>`).join('');
  }
}
function render() {
  if (gameState.isAllCleared) {
    renderAllClear();
  } else if (gameState.currentStageId === 'verb_battle') {
    renderVerbBattle();
  } else if (gameState.currentStageId === 'gokui') {
    renderGokui();
  } else if (gameState.currentStageId === 'last_boss') {
    renderLastBoss();
  } else if (gameState.currentStageId === 'endroll') {
    renderEndroll();
  } else if (gameState.currentStageId === 'reading_stage') {
    renderReadingStage();
  } else if (gameState.currentStageId === null) {
    renderStageSelect();
  } else {
    renderQuestion();
  }
}

function renderQuestion() {
  const stage = STAGES.find(s => s.id === gameState.currentStageId);
  const isBoss = !stage.noBoss && gameState.currentStep === stage.questions.length;
  
  if (isBoss && stage.boss && stage.boss.isTimeTrial) {
    renderStage12Boss();
    return;
  }
  const container = document.getElementById('main-content');
  let qData;
  if (isBoss) {
    if (stage.boss.type === "normal" || stage.boss.type === "sort") {
      qData = stage.boss.questions[gameState.bossSubStep];
    } else {
      qData = stage.boss;
    }
  } else {
    qData = stage.questions[gameState.currentStep];
  }
  let html = '';
  html += `
    <div class="battle-scene">
      <div>
        <div class="pixel-char">⚔🛡️</div>
        <div style="font-size:0.75rem; color:var(--accent-color); margin-top:4px;">プレーヤー</div>
      </div>
      <div style="font-size:1.2rem; color:#8b949e;">VS</div>
      <div>
        <div class="monster-char">${stage.monsterEmoji}</div>
        <div style="font-size:0.75rem; color:var(--danger-color); margin-top:4px;">${stage.monsterName}</div>
      </div>
    </div>
  `;
  if (isBoss) {
    html += `<div class="card boss-card"><div class="boss-header">⚠️ BOSS BATTLE ⚠️</div>`;
  } else {
    html += `<div class="card"><div class="card-header"><span>${stage.title} - Q${gameState.currentStep + 1}/${stage.questions.length}</span><span style="font-size:0.8rem; color:#8b949e; cursor:pointer;" onclick="exitStage()">✕ 中断</span></div>`;
  }
  html += `<div class="question-text">${qData.text.replace(/\n/g, '<br>')}</div>`;
  
  const isSortType = qData.type === "sort" || (isBoss && stage.boss.type === "sort");
  if (isSortType && gameState.subStep === 0) {
    html += `<div style="font-size:0.85rem; color:#8b949e; margin-bottom:5px;">【選択した項目】（タップで取り消し）</div>`;
    html += `<div class="word-answer-box">`;
    if (gameState.selectedWords.length === 0) {
      html += `<span style="color:#484f58; font-size:0.85rem;">下の項目をクリックして並べかえ</span>`;
    } else {
      gameState.selectedWords.forEach((wordObj, idx) => {
        html += `<span class="word-chip" onclick="unselectWord(${idx})">${wordObj.word}</span>`;
      });
    }
    html += `</div>`;
    html += `<div style="font-size:0.85rem; color:#8b949e; margin-bottom:5px;">【選択肢リスト】</div>`;
    html += `<div class="word-pool">`;
    qData.words.forEach((w, idx) => {
      const isUsed = gameState.selectedWords.some(item => item.origIdx === idx);
      if (!isUsed) {
        html += `<span class="word-chip" onclick="selectWord('${w.replace(/'/g, "\\'")}', ${idx})">${w}</span>`;
      }
    });
    html += `</div>`;
    html += `<div style="text-align:right; margin-top:10px;">
      <button class="sort-action-btn" onclick="checkSortAnswer()" ${gameState.selectedWords.length === 0 ? 'disabled' : ''}>回答判定 ▶</button>
    </div>`;
  } else if (gameState.subStep === 0) {
    html += `<div class="options" id="opt-list">`;
    qData.options.forEach((opt, idx) => {
      html += `<button class="btn" onclick="checkAnswer(${idx}, false)">${opt.label}</button>`;
    });
    html += `</div>`;
  } else {
    html += `<div style="margin-bottom:10px; font-weight:bold; color:var(--gold-color);">${qData.logicText}</div>`;
    html += `<div class="options" id="opt-list">`;
    qData.logicOptions.forEach((opt, idx) => {
      html += `<button class="btn" onclick="checkAnswer(${idx}, true)">${opt.label}</button>`;
    });
    html += `</div>`;
  }
  html += `<div id="fb" class="feedback"></div></div>`;
  container.innerHTML = html;
}
function selectWord(word, origIdx) {
  initAudio();
  gameState.selectedWords.push({ word: word, origIdx: origIdx });
  saveData();
  render();
}
function unselectWord(idx) {
  initAudio();
  gameState.selectedWords.splice(idx, 1);
  saveData();
  render();
}
function checkSortAnswer() {
  initAudio();
  const stage = STAGES.find(s => s.id === gameState.currentStageId);
  const isBoss = gameState.currentStep === stage.questions.length;
  let qData = isBoss ? stage.boss.questions[gameState.bossSubStep] : stage.questions[gameState.currentStep];
  const fbEl = document.getElementById('fb');
  const userSentence = gameState.selectedWords.map(w => w.word).join(' ');
  const normalize = (str) => {
    return str.trim()
      .replace(/[.? !]$/, '')
      .toLowerCase();
  };
  const isCorrect = normalize(userSentence) === normalize(qData.correctAnswer);
  if (isCorrect) {
    playSound('correct');
    addExp(10);
    fbEl.className = "feedback active correct-fb";
    fbEl.innerHTML = "<strong>並べかえ正解！ (+10 EXP)</strong><br>続いて「判断基準」を選んでください。";
    setTimeout(() => {
      gameState.subStep = 1;
      saveData();
      render();
    }, 1200);
  } else {
    playSound('wrong');
    fbEl.className = "feedback active wrong-fb";
    fbEl.innerHTML = `<strong>不正解...</strong><br>${qData.wrongComment}`;
  }
}
function checkAnswer(selectedIndex, isLogicStep) {
  initAudio();
  const stage = STAGES.find(s => s.id === gameState.currentStageId);
  const isBoss = gameState.currentStep === stage.questions.length;
  let qData;
  let totalBossQuestions = 1;
  if (isBoss) {
    if (stage.boss.type === "normal" || stage.boss.type === "sort") {
      qData = stage.boss.questions[gameState.bossSubStep];
      totalBossQuestions = stage.boss.questions.length;
    } else {
      qData = stage.boss;
    }
  } else {
    qData = stage.questions[gameState.currentStep];
  }
  const targetOptions = isLogicStep ? qData.logicOptions : qData.options;
  const selected = targetOptions[selectedIndex];
  const fbEl = document.getElementById('fb');
  const buttons = document.querySelectorAll('#opt-list .btn');
  buttons.forEach(b => b.disabled = true);
  
  if (selected.correct) {
    buttons[selectedIndex].classList.add('correct');
    if (!isLogicStep) {
      playSound('correct');
      addExp(10);
      fbEl.className = "feedback active correct-fb";
      fbEl.innerHTML = "<strong>正解！ (+10 EXP)</strong><br>続いて「判断基準」を選んでください。";
      setTimeout(() => {
        gameState.subStep = 1;
        saveData();
        render();
      }, 1200);
    } else {
      if (isBoss) {
        if (gameState.bossSubStep + 1 < totalBossQuestions) {
          playSound('correct');
          addExp(20);
          fbEl.className = "feedback active correct-fb";
          fbEl.innerHTML = "<strong>判断基準も正解！ (+20 EXP)</strong><br>次のボス問題へ！";
          setTimeout(() => {
            gameState.bossSubStep++;
            gameState.subStep = 0;
            gameState.selectedWords = [];
            saveData();
            render();
          }, 1200);
        } else {
          playSound('clear');
          triggerConfetti();
          addExp(20);
          fbEl.className = "feedback active correct-fb";
          fbEl.innerHTML = `<strong>🏆 BOSS K.O.!! (+20 EXP)</strong><br>【${stage.rewardSkill}】を獲得しました！`;
          setTimeout(() => {
            if (!gameState.unlockedSkills.includes(stage.rewardSkill)) {
              gameState.unlockedSkills.push(stage.rewardSkill);
            }
            if (typeof stage.id === 'number' && gameState.unlockedStage === stage.id) {
              gameState.unlockedStage = stage.id + 1;
            }
            
            alert(`🎉 ${stage.title} CLEAR!\n獲得した判断の眼: 【${stage.rewardSkill}】`);
            gameState.currentStageId = null;
            gameState.currentStep = 0;
            gameState.subStep = 0;
            gameState.bossSubStep = 0;
            gameState.selectedWords = [];
            saveData();
            render();
          }, 1500);
        }
      } else {
        const isFinalNoBossQuestion =
          stage.noBoss && gameState.currentStep + 1 >= stage.questions.length;

        // 最終問題では、クリア演出をコメント表示より先に実行する
        if (isFinalNoBossQuestion) {
          playSound('clear');
          triggerConfetti();
        } else {
          playSound('correct');
        }
        addExp(20);
        fbEl.className = "feedback active correct-fb";
        fbEl.innerHTML = isFinalNoBossQuestion
          ? `<strong>🏆 ${stage.title} CLEAR!</strong><br>【${stage.rewardSkill}】を獲得しました！`
          : "<strong>判断基準も正解！ (+20 EXP)</strong>";
        setTimeout(() => {
          if (isFinalNoBossQuestion) {
            if (!gameState.unlockedSkills.includes(stage.rewardSkill)) {
              gameState.unlockedSkills.push(stage.rewardSkill);
            }
            gameState.unlockedStage = Math.max(gameState.unlockedStage, stage.id + 1);
            gameState.gokuiUnlocked = false;
            gameState.currentStageId = null;
            gameState.currentStep = 0;
            gameState.subStep = 0;
            gameState.bossSubStep = 0;
            gameState.selectedWords = [];
            saveData();
            alert(`🎉 ${stage.title} CLEAR!\n獲得した判断の眼:【${stage.rewardSkill}】を獲得しました！`);
            render();
            return;
          }

          gameState.currentStep++;
          gameState.subStep = 0;
          gameState.selectedWords = [];
          saveData();
          render();
        }, 1200);
      }
    }
  } else {
    playSound('wrong');
    buttons[selectedIndex].classList.add('wrong');
    fbEl.className = "feedback active wrong-fb";
    fbEl.innerHTML = `<strong>不正解...</strong><br>${qData.wrongComment}`;
    setTimeout(() => {
      buttons.forEach(b => b.disabled = false);
    }, 1500);
  }
  saveData();
}

       color: #166534;\n            font-weight: 700;\n            padding: 0.1rem 0.3rem;\n            border-radius: 0.25rem;\n            box-shadow: 0 0 0 2px #bbf7d0;\n        }\n    </style>\n</head>\n<body class=\"h-full font-sans text-slate-800 flex flex-col justify-between selection:bg-indigoCustom-500 selection:text-white\">\n    <!-- Header Navigation -->\n    <header class=\"bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm\">\n        <div class=\"max-w-4xl mx-auto px-4 py-3 flex items-center justify-between\">\n            <div class=\"flex items-center gap-3\">\n                <div class=\"w-10 h-10 rounded-xl bg-indigoCustom-600 text-white flex items-center justify-center font-bold text-lg shadow-md shadow-indigoCustom-500/20\">\n                    <i class=\"fa-solid fa-book-open-reader\"></i>\n                </div>\n                <div>\n                    <h1 class=\"font-bold text-slate-900 text-base sm:text-lg leading-tight\">英語読解OS</h1>\n                    <p class=\"text-xs text-slate-500 font-medium\">読解理由問題の解法OS</p>\n                </div>\n            </div>\n            <div class=\"bg-indigoCustom-50 border border-indigoCustom-100 px-3 py-1.5 rounded-full text-xs font-semibold text-indigoCustom-700 flex items-center gap-2\">\n                <span class=\"w-2 h-2 rounded-full bg-indigoCustom-500 animate-pulse\"></span>\n                読解STAGE\n            </div>\n        </div>\n    </header>\n    <!-- Main Content Container -->\n    <main class=\"max-w-3xl mx-auto px-4 py-6 sm:py-8 w-full flex-grow\">\n        <!-- Progress Indicator -->\n        <div id=\"progress-container\" class=\"mb-6 hidden\">\n            <div class=\"flex justify-between items-center mb-2\">\n                <span id=\"progress-label\" class=\"text-xs font-bold text-indigoCustom-700 tracking-wider uppercase\">Step 1 / 3: 【着眼】スキャニング</span>\n                <span id=\"progress-percent\" class=\"text-xs font-semibold text-slate-500\">25%</span>\n            </div>\n            <div class=\"w-full bg-slate-200 h-2 rounded-full overflow-hidden\">\n                <div id=\"progress-bar\" class=\"bg-gradient-to-r from-indigoCustom-500 to-emeraldCustom-500 h-full rounded-full transition-all duration-500 ease-out\" style=\"width: 25%\"></div>\n            </div>\n        </div>\n        <!-- Dynamic Content Card -->\n        <div id=\"app-card\" class=\"bg-white rounded-2xl border border-slate-200 shadow-xl shadow-slate-200/50 p-5 sm:p-8 relative overflow-hidden transition-all duration-300\">\n            <!-- App Screens are dynamically rendered here -->\n        </div>\n    </main>\n    <!-- Footer -->\n    <footer class=\"bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500\">\n        <div class=\"max-w-4xl mx-auto px-4\">\n            判断プロセストレーニング（読解編） &copy; 2026\n        </div>\n    </footer>\n    <!-- Audio Synthesizer for SFX -->\n    <script>\n        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();\n        function playSound(type) {\n            try {\n                if (audioCtx.state === 'suspended') {\n                    audioCtx.resume();\n                }\n                const osc = audioCtx.createOscillator();\n                const gain = audioCtx.createGain();\n                osc.connect(gain);\n                gain.connect(audioCtx.destination);\n                if (type === 'click') {\n                    osc.type = 'sine';\n                    osc.frequency.setValueAtTime(600, audioCtx.currentTime);\n                    gain.gain.setValueAtTime(0.05, audioCtx.currentTime);\n                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);\n                    osc.start();\n                    osc.stop(audioCtx.currentTime + 0.05);\n                } else if (type === 'correct') {\n                    osc.type = 'triangle';\n                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5\n                    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5\n                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);\n                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);\n                    osc.start();\n                    osc.stop(audioCtx.currentTime + 0.3);\n                } else if (type === 'wrong') {\n                    osc.type = 'sawtooth';\n                    osc.frequency.setValueAtTime(220, audioCtx.currentTime); // A3\n                    osc.frequency.setValueAtTime(196, audioCtx.currentTime + 0.1); // G3\n                    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);\n                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);\n                    osc.start();\n                    osc.stop(audioCtx.currentTime + 0.25);\n                }\n            } catch(e) {}\n        }\n    <\/script>\n    <!-- JavaScript Application Logic -->\n    <script>\n        const state = {\n            currentScreen: 'intro', // 'intro', 'step1', 'step2', 'step3', 'summary', 'reproduction', 'clear'\n            isAnswered: false,\n            highlightState: 'none' // 'none', 'target', 'cause'\n        };\n\n        const appCard = document.getElementById('app-card');\n        const progressContainer = document.getElementById('progress-container');\n        const progressBar = document.getElementById('progress-bar');\n        const progressLabel = document.getElementById('progress-label');\n        const progressPercent = document.getElementById('progress-percent');\n\n        function getBasePassageHTML() {\n            let p = \"Ken went to the library yesterday. He wanted to read a book about Japanese history because he has a test next week. When he got there, he found that the library was closed. So, he decided to buy a book at the bookstore instead.\";\n            \n            if (state.highlightState === 'target') {\n                p = p.replace('decided to buy a book at the bookstore instead.', '<span class=\"highlight-target\">decided to buy a book at the bookstore instead.</span>');\n            } else if (state.highlightState === 'cause') {\n                p = p.replace('decided to buy a book at the bookstore instead.', '<span class=\"highlight-target\">decided to buy a book at the bookstore instead.</span>');\n                p = p.replace('the library was closed.', '<span class=\"highlight-cause\">the library was closed.</span>');\n            }\n            return p;\n        }\n\n        function updateProgress(stepText, percent) {\n            progressContainer.classList.remove('hidden');\n            progressLabel.textContent = stepText;\n            progressPercent.textContent = `${percent}%`;\n            progressBar.style.width = `${percent}%`;\n        }\n        function hideProgress() {\n            progressContainer.classList.add('hidden');\n        }\n\n        function renderScreen() {\n            appCard.classList.remove('fade-in');\n            void appCard.offsetWidth; \n            appCard.classList.add('fade-in');\n            switch (state.currentScreen) {\n                case 'intro': renderIntro(); break;\n                case 'step1': renderStep1(); break;\n                case 'step2': renderStep2(); break;\n                case 'step3': renderStep3(); break;\n                case 'summary': renderSummary(); break;\n                case 'reproduction': renderReproduction(); break;\n                case 'clear': renderClear(); break;\n            }\n        }\n\n        function renderIntro() {\n            hideProgress();\n            state.highlightState = 'none';\n            appCard.innerHTML = `\n                <div class=\"space-y-6\">\n                    <div class=\"inline-flex items-center gap-2 px-3 py-1 rounded-md bg-amber-50 text-amber-800 text-xs font-semibold border border-amber-200\">\n                        <i class=\"fa-solid fa-lightbulb text-amber-600\"></i> 解説：読解（理由選択問題）\n                    </div>\n                    <h2 class=\"text-xl sm:text-2xl font-bold text-slate-900 leading-snug\">\n                        理由を問う問題は、感覚で解釈しない！<br>\n                        <span class=\"text-indigoCustom-600\">「因果関係の検索ロジック」</span>をマスターしよう\n                    </h2>\n                    <div class=\"bg-slate-50 border border-slate-200 rounded-xl p-5 space-y-4\">\n                        <div>\n                            <span class=\"text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1\">【英文本文】</span>\n                            <p class=\"text-slate-800 font-serif leading-relaxed text-base sm:text-lg bg-white p-4 rounded-lg border border-slate-200\">\n                                ${getBasePassageHTML()}\n                            </p>\n                        </div>\n                        <div class=\"border-t border-slate-200 pt-3\">\n                            <span class=\"text-xs font-bold text-indigoCustom-600 uppercase tracking-wider block mb-1\">【設問】</span>\n                            <p class=\"text-slate-900 font-bold text-base\">\n                                Question: Why did Ken go to the bookstore?\n                            </p>\n                        </div>\n                    </div>\n                    <div class=\"bg-indigoCustom-50 border border-indigoCustom-100 rounded-xl p-4 text-sm text-slate-600 space-y-1\">\n                        <p class=\"font-bold text-indigoCustom-700 flex items-center gap-1.5\">\n                            <i class=\"fa-solid fa-circle-check\"></i> この問題の攻略手順\n                        </p>\n                        <p>読解問題で最も大切なのは<b>「設問のキーワードを本文で探す（着眼）」➔「前後の因果関係（SoやBecauseなど）を判断」➔「正解の根拠を特定（処理）」</b>の3ステップです。</p>\n                    </div>\n                    <button onclick=\"playSound('click'); nextScreen('step1');\" class=\"w-full py-4 bg-indigoCustom-600 hover:bg-indigoCustom-700 active:scale-[0.99] text-white font-bold text-lg rounded-xl shadow-lg shadow-indigoCustom-500/25 transition-all duration-200 flex items-center justify-center gap-2\">\n                        <span>判断ステップを始める</span>\n                        <i class=\"fa-solid fa-arrow-right\"></i>\n                    </button>\n                </div>\n            `;\n        }\n\n        function renderStep1() {\n            updateProgress('Step 1 / 3: 【着眼】スキャニング', 25);\n            state.isAnswered = false;\n            state.highlightState = 'none';\n            appCard.innerHTML = `\n                <div class=\"space-y-6\">\n                    <div class=\"flex items-center gap-2\">\n                        <span class=\"px-2.5 py-1 bg-indigoCustom-100 text-indigoCustom-700 text-xs font-extrabold rounded-md\">STEP 1</span>\n                        <h3 class=\"text-lg font-bold text-slate-800\">【着眼】スキャニング（該当箇所の発見）</h3>\n                    </div>\n                    <div class=\"bg-slate-50 p-4 rounded-xl border border-slate-200 text-sm\">\n                        <p class=\"text-xs font-bold text-slate-400 mb-1\">本文：</p>\n                        <p id=\"step-passage\" class=\"font-serif text-slate-800 text-base leading-relaxed\">\n                            ${getBasePassageHTML()}\n                        </p>\n                    </div>\n                    <div class=\"bg-amber-50 border border-amber-200 p-3 rounded-lg text-xs text-amber-900 font-medium\">\n                        設問：Why did Ken <b>go to the bookstore</b>?\n                    </div>\n                    <p class=\"font-bold text-slate-800 text-base\">\n                        Q1. 最初に本文から探すべきキーワードと、その該当箇所は本文のどこにありますか？\n                    </p>\n                    <div class=\"space-y-3\" id=\"options-container\">\n                        ${createOptionButton(1, 'A', '最後の文の「decided to buy a book at the bookstore」の部分', true)}\n                        ${createOptionButton(2, 'B', '2文目の「Japanese history / test next week」の部分')}\n                        ${createOptionButton(3, 'C', '1文目の「went to the library」の部分')}\n                    </div>\n                    <div id=\"feedback-area\" class=\"hidden\"></div>\n                    <button id=\"btn-next\" onclick=\"playSound('click'); nextScreen('step2');\" class=\"w-full py-3.5 bg-indigoCustom-600 text-white font-bold text-base rounded-xl hidden flex items-center justify-center gap-2 shadow-md\">\n                        <span>次へ：STEP 2【判断】因果関係の特定へ</span>\n                        <i class=\"fa-solid fa-arrow-right\"></i>\n                    </button>\n                </div>\n            `;\n        }\n\n        function renderStep2() {\n            updateProgress('Step 2 / 3: 【判断】因果関係の特定', 50);\n            state.isAnswered = false;\n            state.highlightState = 'target'; // ステップ2開始時点では結果文のみハイライト\n            appCard.innerHTML = `\n                <div class=\"space-y-6\">\n                    <div class=\"flex items-center gap-2\">\n                        <span class=\"px-2.5 py-1 bg-indigoCustom-100 text-indigoCustom-700 text-xs font-extrabold rounded-md\">STEP 2</span>\n                        <h3 class=\"text-lg font-bold text-slate-800\">【判断】結果の「前の文（原因）」に着目する</h3>\n                    </div>\n                    <div class=\"bg-slate-50 p-4 rounded-xl border border-slate-200 text-sm\">\n                        <p class=\"text-xs font-bold text-slate-400 mb-1\">本文（黄色が「結果」の文）：</p>\n                        <p id=\"step2-passage\" class=\"font-serif text-slate-800 text-base leading-relaxed\">\n                            ${getBasePassageHTML()}\n                        </p>\n                    </div>\n                    <div class=\"bg-blue-50 border border-blue-200 p-3 rounded-lg text-xs text-blue-900 font-medium\">\n                        黄色い文の冒頭にある <b>「So, ...」（だから〜）</b> に着目！「So」の前にある文が理由（原因）です。\n                    </div>\n                    <p class=\"font-bold text-slate-800 text-base\">\n                        Q2. Kenが本屋で本を買うことにした「直接の理由」となっている本文の事実はどれですか？\n                    </p>\n                    <div class=\"space-y-3\" id=\"options-container\">\n                        ${createOptionButton(1, 'A', '来週日本史のテストがあるから (has a test next week)')}\n                        ${createOptionButton(2, 'B', '図書館が閉まっていたから (the library was closed)', true)}\n                        ${createOptionButton(3, 'C', '昨日図書館に行ったから (went to the library yesterday)')}\n                    </div>\n                    <div id=\"feedback-area\" class=\"hidden\"></div>\n                    <button id=\"btn-next\" onclick=\"playSound('click'); nextScreen('step3');\" class=\"w-full py-3.5 bg-indigoCustom-600 text-white font-bold text-base rounded-xl hidden flex items-center justify-center gap-2 shadow-md\">\n                        <span>次へ：STEP 3【処理】正解の判定と消去法へ</span>\n                        <i class=\"fa-solid fa-arrow-right\"></i>\n                    </button>\n                </div>\n            `;\n        }\n\n        function renderStep3() {\n            updateProgress('Step 3 / 3: 【処理】正解の根拠と消去法', 75);\n            state.isAnswered = false;\n            state.highlightState = 'cause'; // ステップ3では原因文もハイライト済み\n            appCard.innerHTML = `\n                <div class=\"space-y-6\">\n                    <div class=\"flex items-center gap-2\">\n                        <span class=\"px-2.5 py-1 bg-indigoCustom-100 text-indigoCustom-700 text-xs font-extrabold rounded-md\">STEP 3</span>\n                        <h3 class=\"text-lg font-bold text-slate-800\">【処理】根拠の照合と誤答の排除</h3>\n                    </div>\n                    <div class=\"bg-slate-50 p-4 rounded-xl border border-slate-200 text-sm\">\n                        <p class=\"text-xs font-bold text-slate-400 mb-1\">本文（緑色が「直接の理由」）：</p>\n                        <p class=\"font-serif text-slate-800 text-base leading-relaxed\">\n                            ${getBasePassageHTML()}\n                        </p>\n                    </div>\n                    <p class=\"font-bold text-slate-800 text-base\">\n                        Q3. 次のうち、模試の選択肢「Because he wanted to read a book about Japanese history.」（日本史の本が読みたかったから）を選んではいけない理由は？\n                    </p>\n                    <div class=\"space-y-3\" id=\"options-container\">\n                        ${createOptionButton(1, 'A', '「図書館に行った理由」であり、「本屋に行った直接の理由」ではないから', true)}\n                        ${createOptionButton(2, 'B', '本文に書いていない嘘の内容だから')}\n                        ${createOptionButton(3, 'C', 'Kenは歴史のテストを受けたくないと思っているから')}\n                    </div>\n                    <div id=\"feedback-area\" class=\"hidden\"></div>\n                    <button id=\"btn-next\" onclick=\"playSound('click'); nextScreen('summary');\" class=\"w-full py-3.5 bg-indigoCustom-600 text-white font-bold text-base rounded-xl hidden flex items-center justify-center gap-2 shadow-md\">\n                        <span>解法アルゴリズムのまとめへ</span>\n                        <i class=\"fa-solid fa-arrow-right\"></i>\n                    </button>\n                </div>\n            `;\n        }\n\n        function createOptionButton(id, letter, text, isCorrect = false) {\n            return `\n                <button onclick=\"checkAnswer(${id}, ${isCorrect})\" id=\"opt-${id}\" class=\"opt-btn w-full text-left p-4 rounded-xl border-2 border-slate-200 hover:border-indigoCustom-500 hover:bg-indigoCustom-50/50 transition-all duration-150 font-medium text-slate-700 flex items-start gap-3 group\">\n                    <span class=\"w-6 h-6 rounded-full bg-slate-100 group-hover:bg-indigoCustom-500 group-hover:text-white text-slate-500 text-xs font-bold flex items-center justify-center flex-shrink-0 mt-0.5 transition-colors\">\n                        ${letter}\n                    </span>\n                    <span class=\"text-sm sm:text-base leading-relaxed\">${text}</span>\n                </button>\n            `;\n        }\n\n        function checkAnswer(selectedId, isCorrect) {\n            const selectedBtn = document.getElementById(`opt-${selectedId}`);\n            const feedbackArea = document.getElementById('feedback-area');\n            const nextBtn = document.getElementById('btn-next');\n\n            if (isCorrect) {\n                // 正解の処理（一度正解したら他のボタンもロックし、やり直し不可にする）\n                if (state.isAnswered) return;\n                state.isAnswered = true;\n\n                playSound('correct');\n                document.querySelectorAll('.opt-btn').forEach(btn => {\n                    btn.classList.add('cursor-not-allowed', 'opacity-60');\n                    btn.removeAttribute('onclick');\n                });\n\n                selectedBtn.classList.remove('border-slate-200', 'hover:border-indigoCustom-500', 'opacity-60');\n                selectedBtn.classList.add('border-emeraldCustom-500', 'bg-emerald-50', 'text-emerald-900', 'ring-2', 'ring-emeraldCustom-500/20');\n                \n                feedbackArea.className = 'p-4 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-sm space-y-1 fade-in';\n                feedbackArea.innerHTML = `\n                    <div class=\"font-bold flex items-center gap-2 text-emerald-700 text-base\">\n                        <i class=\"fa-solid fa-circle-check text-emerald-500 text-xl\"></i> 正解！完璧な読み取りです。\n                    </div>\n                    <p class=\"text-xs text-emerald-600\">根拠のある読解ステップを踏めています。このロジックが再現性のカギです！</p>\n                `;\n\n                // ステップ2正解時にその場で原因箇所のハイライトを適用する\n                if (state.currentScreen === 'step2') {\n                    state.highlightState = 'cause';\n                    const p2Elem = document.getElementById('step2-passage');\n                    if (p2Elem) p2Elem.innerHTML = getBasePassageHTML();\n                }\n\n                feedbackArea.classList.remove('hidden');\n                nextBtn.classList.remove('hidden');\n                nextBtn.classList.add('fade-in');\n\n            } else {\n                // 不正解の処理：選んだボタンだけ赤くするが、state.isAnsweredはtrueにしないため他の選択肢を再選択できる\n                playSound('wrong');\n                selectedBtn.disabled = true;\n                selectedBtn.classList.add('border-rose-400', 'bg-rose-50', 'text-rose-900', 'opacity-70');\n                selectedBtn.removeAttribute('onclick');\n\n                feedbackArea.className = 'p-4 rounded-xl bg-rose-50 border border-rose-200 text-rose-800 text-sm space-y-1 fade-in';\n                feedbackArea.innerHTML = `\n                    <div class=\"font-bold flex items-center gap-2 text-rose-700 text-base\">\n                        <i class=\"fa-solid fa-circle-xmark text-rose-500 text-xl\"></i> 惜しい！別の選択肢を選び直してください。\n                    </div>\n                    <p class=\"text-xs text-rose-600\">問題文が求めている箇所・因果関係をもう一度確認しましょう。</p>\n                `;\n                feedbackArea.classList.remove('hidden');\n                // ※ 正解するまで nextBtn は出さない（次のステップに行かせない）\n            }\n        }\n\n        function renderSummary() {\n            updateProgress('読解解法OSの体系化', 90);\n            appCard.innerHTML = `\n                <div class=\"space-y-6\">\n                    <div class=\"text-center space-y-2\">\n                        <span class=\"px-3 py-1 bg-emerald-100 text-emerald-800 text-xs font-bold rounded-full\">読解理由問題 解法OS</span>\n                        <h3 class=\"text-xl sm:text-2xl font-bold text-slate-900\">「Why問」を確実に仕留める解法OS</h3>\n                    </div>\n                    <div class=\"bg-gradient-to-br from-slate-900 to-slate-800 text-white rounded-2xl p-6 shadow-lg space-y-4 relative overflow-hidden\">\n                        <div class=\"absolute -right-4 -bottom-4 opacity-10 text-8xl text-white\">\n                            <i class=\"fa-solid fa-magnifying-glass\"></i>\n                        </div>\n                        <div class=\"border-b border-slate-700 pb-3\">\n                            <p class=\"text-xs font-semibold text-indigoCustom-500 tracking-wider uppercase\">理由問題の方程式</p>\n                            <p class=\"text-base sm:text-lg font-mono font-bold mt-1 text-emerald-300\">\n                                設問のキーワード(結果) ➔ 本文スキャニング ➔ 直前の原因(So/Because/When)\n                            </p>\n                        </div>\n                        <div class=\"space-y-3 text-sm text-slate-300\">\n                            <div class=\"flex items-start gap-2.5\">\n                                <span class=\"bg-indigoCustom-500 text-white text-xs font-bold rounded px-2 py-0.5 mt-0.5\">1</span>\n                                <div>\n                                    <strong class=\"text-white\">【着眼】設問のスキャニング</strong><br>\n                                    Why did S V...? のVや目的語（例: bookstore）を本文から探す。\n                                </div>\n                            </div>\n                            <div class=\"flex items-start gap-2.5\">\n                                <span class=\"bg-indigoCustom-500 text-white text-xs font-bold rounded px-2 py-0.5 mt-0.5\">2</span>\n                                <div>\n                                    <strong class=\"text-white\">【判断】直接の因果関係の特定</strong><br>\n                                    「So...（だから）」の前の文、あるいは「Because...」の節が直接の「原因」になる。\n                                </div>\n                            </div>\n                            <div class=\"flex items-start gap-2.5\">\n                                <span class=\"bg-indigoCustom-500 text-white text-xs font-bold rounded px-2 py-0.5 mt-0.5\">3</span>\n                                <div>\n                                    <strong class=\"text-white\">【処理】まぎらわしい選択肢（トラップ）の排除</strong><br>\n                                    「本文には書いてあるが、別の行動の理由になっている選択肢」に騙されない！\n                                </div>\n                            </div>\n                        </div>\n                    </div>\n                    <div class=\"bg-amber-50 border border-amber-200 rounded-xl p-4 text-amber-900 text-sm flex items-start gap-3\">\n                        <i class=\"fa-solid fa-circle-exclamation text-amber-600 text-lg mt-0.5\"></i>\n                        <div>\n                            <p class=\"font-bold\">ここからが本番！「再現テスト」</p>\n                            <p class=\"text-xs text-amber-800 mt-0.5\">別のストーリー（Emiの物語）で、全く同じ読解OSを使って正解を自力で導き出せるかテストします！</p>\n                        </div>\n                    </div>\n                    <button onclick=\"playSound('click'); nextScreen('reproduction');\" class=\"w-full py-4 bg-emeraldCustom-600 hover:bg-emeraldCustom-500 active:scale-[0.99] text-white font-bold text-lg rounded-xl shadow-lg shadow-emerald-600/25 transition-all duration-200 flex items-center justify-center gap-2\">\n                        <i class=\"fa-solid fa-pen-to-square\"></i>\n                        <span>類題テストで再現力を確認する</span>\n                    </button>\n                </div>\n            `;\n        }\n\n        function renderReproduction() {\n            updateProgress('類題再現テスト', 95);\n            appCard.innerHTML = `\n                <div class=\"space-y-6\">\n                    <div class=\"flex items-center justify-between border-b border-slate-200 pb-3\">\n                        <span class=\"px-3 py-1 bg-amber-100 text-amber-800 text-xs font-bold rounded-full flex items-center gap-1\">\n                            <i class=\"fa-solid fa-fire text-amber-600\"></i> 類題チャレンジ\n                        </span>\n                        <span class=\"text-xs text-slate-500 font-medium\">ヒントなし・自力で読解OSを実行！</span>\n                    </div>\n                    <div class=\"space-y-2\">\n                        <h3 class=\"text-lg font-bold text-slate-900\">【初見問題】学んだ読解OSを使って解こう</h3>\n                        <p class=\"text-xs text-slate-500\">次の英文を読み、設問に対する最も適切な答えを選びなさい。</p>\n                    </div>\n                    <div class=\"bg-slate-900 text-white p-5 rounded-xl space-y-4 shadow-inner\">\n                        <div class=\"space-y-1\">\n                            <span class=\"text-slate-400 text-xs font-mono\">[Passage]</span>\n                            <p class=\"font-serif leading-relaxed text-base text-slate-100\">\n                                \"Emi visited the park on Sunday to sketch some flowers. However, it started to rain heavily. She ran into a nearby cafe to wait for the rain to stop. While waiting, she drank warm hot chocolate.\"\n                            </p>\n                        </div>\n                        <div class=\"border-t border-slate-700 pt-3\">\n                            <span class=\"text-teal-400 text-xs font-mono font-bold\">[Question]</span>\n                            <p class=\"font-bold text-white text-base sm:text-lg\">\n                                Question: Why did Emi enter the cafe?\n                            </p>\n                        </div>\n                    </div>\n                    <div class=\"space-y-3 pt-1\">\n                        <label class=\"block text-xs font-bold text-slate-500 uppercase tracking-wider\">選択肢を選んで判定：</label>\n                        <div class=\"space-y-2.5\" id=\"repro-options\">\n                            <button onclick=\"checkReproduction('A', false)\" class=\"repro-btn w-full text-left p-3.5 border-2 border-slate-200 rounded-xl font-medium text-slate-700 hover:border-indigoCustom-500 hover:bg-indigoCustom-50 transition-all text-sm flex items-start gap-3\">\n                                <span class=\"font-bold text-slate-400\">A)</span>\n                                <span>Because she wanted to drink hot chocolate.</span>\n                            </button>\n                            <button onclick=\"checkReproduction('B', true)\" class=\"repro-btn w-full text-left p-3.5 border-2 border-slate-200 rounded-xl font-medium text-slate-700 hover:border-indigoCustom-500 hover:bg-indigoCustom-50 transition-all text-sm flex items-start gap-3\">\n                                <span class=\"font-bold text-slate-400\">B)</span>\n                                <span>Because it started to rain heavily.</span>\n                            </button>\n                            <button onclick=\"checkReproduction('C', false)\" class=\"repro-btn w-full text-left p-3.5 border-2 border-slate-200 rounded-xl font-medium text-slate-700 hover:border-indigoCustom-500 hover:bg-indigoCustom-50 transition-all text-sm flex items-start gap-3\">\n                                <span class=\"font-bold text-slate-400\">C)</span>\n                                <span>Because she wanted to meet her friends.</span>\n                            </button>\n                            <button onclick=\"checkReproduction('D', false)\" class=\"repro-btn w-full text-left p-3.5 border-2 border-slate-200 rounded-xl font-medium text-slate-700 hover:border-indigoCustom-500 hover:bg-indigoCustom-50 transition-all text-sm flex items-start gap-3\">\n                                <span class=\"font-bold text-slate-400\">D)</span>\n                                <span>Because the park was closed.</span>\n                            </button>\n                        </div>\n                    </div>\n                    <div id=\"repro-feedback\" class=\"hidden\"></div>\n                </div>\n            `;\n        }\n\n        function checkReproduction(optionKey, isCorrect) {\n            const feedback = document.getElementById('repro-feedback');\n            const btns = document.querySelectorAll('.repro-btn');\n            \n            if (isCorrect) {\n                btns.forEach(btn => btn.disabled = true);\n                playSound('correct');\n                confetti({\n                    particleCount: 120,\n                    spread: 80,\n                    origin: { y: 0.6 }\n                });\n                feedback.className = 'p-5 bg-emerald-50 border border-emerald-200 rounded-xl text-center space-y-3 fade-in';\n                feedback.innerHTML = `\n                    <div class=\"text-emerald-700 font-extrabold text-lg flex items-center justify-center gap-2\">\n                        <i class=\"fa-solid fa-circle-check text-2xl text-emerald-500\"></i>\n                        読解OS再現成功！(正解: B)\n                    </div>\n                    <div class=\"text-xs text-emerald-800 text-left bg-white p-3 rounded-lg border border-emerald-100 space-y-1\">\n                        <p class=\"font-bold\">【解法プロセスの検証】</p>\n                        <p>1. 設問の「enter the cafe」➔ 本文の「ran into a nearby cafe」にスキャニング着眼！</p>\n                        <p>2. その原因は直前の「it started to rain heavily」➔ だからBが正解！</p>\n                        <p>※ Aの「hot chocolate」はカフェに入った後の結果なのでトラップ（誤答）です。</p>\n                    </div>\n                    <button onclick=\"playSound('click'); nextScreen('clear');\" class=\"w-full py-3 bg-emeraldCustom-600 hover:bg-emeraldCustom-500 text-white font-bold rounded-lg shadow transition-all text-sm\">\n                        ミッションクリア画面へ <i class=\"fa-solid fa-trophy ml-1\"></i>\n                    </button>\n                `;\n                feedback.classList.remove('hidden');\n            } else {\n                playSound('wrong');\n                // 不正解のときは選んだボタンだけ無効化して再選択可能にする\n                event.currentTarget.disabled = true;\n                event.currentTarget.classList.add('opacity-50', 'bg-rose-50', 'border-rose-300');\n\n                feedback.className = 'p-5 bg-rose-50 border border-rose-200 rounded-xl text-center space-y-3 fade-in';\n                feedback.innerHTML = `\n                    <div class=\"text-rose-700 font-bold text-base flex items-center justify-center gap-2\">\n                        <i class=\"fa-solid fa-circle-xmark text-xl text-rose-500\"></i>\n                        残念！別の選択肢を選び直してみましょう。\n                    </div>\n                    <p class=\"text-xs text-rose-800\">\n                        Aのhot chocolateはカフェに「入った後（While waiting）」の出来事です。カフェに入った「直接の原因」をもう一度探してみよう！\n                    </p>\n                `;\n                feedback.classList.remove('hidden');\n            }\n        }\n\n        function renderClear() {\n            updateProgress('全ミッション完了！', 100);\n            appCard.innerHTML = `\n                <div class=\"text-center py-6 space-y-6\">\n                    <div class=\"relative inline-block\">\n                        <div class=\"w-24 h-24 bg-gradient-to-tr from-amber-400 to-yellow-300 rounded-full flex items-center justify-center mx-auto shadow-xl shadow-amber-500/20 text-white text-4xl animate-bounce\">\n                            <i class=\"fa-solid fa-award\"></i>\n                        </div>\n                        <span class=\"absolute -top-2 -right-2 bg-indigoCustom-600 text-white text-xs font-bold px-2.5 py-0.5 rounded-full border-2 border-white shadow\">\n                            完全マスター\n                        </span>\n                    </div>\n                    <div class=\"space-y-2\">\n                        <h2 class=\"text-2xl font-extrabold text-slate-900\">読解OS（理由問題）クリア！</h2>\n                        <p class=\"text-sm text-slate-600 max-w-md mx-auto\">\n                            読解の理由問題（Why問）において、根拠のあるスキャニングと因果関係の判定ができるようになりました。\n                        </p>\n                    </div>\n                    <div class=\"bg-slate-50 border border-slate-200 rounded-xl p-4 text-left max-w-md mx-auto space-y-2.5 text-xs\">\n                        <div class=\"font-bold text-slate-700 border-b border-slate-200 pb-2 flex justify-between items-center\">\n                            <span>修得済み解法スキル</span>\n                            <span class=\"text-emerald-600 font-bold\"><i class=\"fa-solid fa-check\"></i> ALL CLEAR</span>\n                        </div>\n                        <div class=\"flex justify-between text-slate-600\">\n                            <span>① 【着眼】設問キーワードの発見（スキャニング）</span>\n                            <span class=\"font-bold text-emerald-600\">習得済み</span>\n                        </div>\n                        <div class=\"flex justify-between text-slate-600\">\n                            <span>② 【判断】So / Because 前後の因果関係判定</span>\n                            <span class=\"font-bold text-emerald-600\">習得済み</span>\n                        </div>\n                        <div class=\"flex justify-between text-slate-600\">\n                            <span>③ 【処理】時系列トラップ選択肢の消去</span>\n                            <span class=\"font-bold text-emerald-600\">習得済み</span>\n                        </div>\n                        <div class=\"flex justify-between text-slate-600 font-bold text-indigoCustom-700 pt-1.5 border-t border-slate-200\">\n                            <span>④ 初見問題（Emiの物語）での自力再現</span>\n                            <span class=\"text-emerald-600\">100% 成功</span>\n                        </div>\n                    </div>\n                    <div class=\"pt-2 space-y-3\">\n                        <button onclick=\"playSound('click'); nextScreen('intro');\" class=\"w-full py-3.5 bg-indigoCustom-600 hover:bg-indigoCustom-700 text-white font-bold text-base rounded-xl shadow-md transition-all flex items-center justify-center gap-2\">\n                            <i class=\"fa-solid fa-rotate-right\"></i>\n                            <span>最初から復習する</span>\n                        </button>\n                        <button onclick=\"playSound('click'); window.parent.postMessage({type:'reading-stage-return'}, '*');\" class=\"w-full py-3.5 bg-slate-700 hover:bg-slate-800 text-white font-bold text-base rounded-xl transition-all flex items-center justify-center gap-2\">\n                            <i class=\"fa-solid fa-arrow-left\"></i>\n                            <span>ステージ選択画面へ戻る</span>\n                        </button>\n                        <p class=\"text-xs text-slate-500\">読解STAGEをクリアすると「英語処理の極意書」が開放されます。</p>\n                    </div>\n                </div>\n            `;\n            if (window.parent && window.parent !== window) {\n                window.parent.postMessage({type:'reading-stage-cleared'}, '*');\n            }\n        }\n\n        function nextScreen(screenName) {\n            state.currentScreen = screenName;\n            renderScreen();\n        }\n\n        window.onload = function() {\n            renderScreen();\n        };\n    <\/script>\n</body>\n</html>";
function startReadingStage() {
  const unlocked = gameState.unlockedSkills.includes("動詞操作統合の眼") || gameState.unlockedStage > 13 || !!gameState.readingCleared;
  if (!unlocked) { alert("読解STAGEの開放条件は STAGE 13 クリアです。"); return; }
  stopBattleTimer(); stopStage12Timer(); stopLastBossTimer();
  gameState.currentStageId = 'reading_stage'; saveData(); render(); window.scrollTo(0, 0);
}
function renderReadingStage() {
  const container = document.getElementById('main-content');
  container.innerHTML = `<div class="card" style="padding:8px;"><div class="card-header"><span>★ 読解STAGE：英語読解OS</span><button class="reset-btn" onclick="exitReadingStage()">✕ 中断</button></div><iframe id="reading-stage-frame" title="英語読解OSマスター" style="display:block;width:100%;height:1050px;border:1px solid var(--border-color);border-radius:8px;background:#f8fafc;" sandbox="allow-scripts allow-same-origin"></iframe></div>`;
  document.getElementById('reading-stage-frame').srcdoc = READING_STAGE_HTML;
}
function exitReadingStage() { gameState.currentStageId = null; saveData(); render(); }
window.addEventListener('message', function(event) {
  const frame = document.getElementById('reading-stage-frame');
  if (!frame || event.source !== frame.contentWindow || !event.data || typeof event.data !== 'object') return;
  if (event.data.type === 'reading-stage-cleared' && !gameState.readingCleared) {
    gameState.readingCleared = true; gameState.gokuiUnlocked = true; gameState.currentStageId = null;
    saveData(); render(); alert("読解STAGE CLEAR！「英語処理の極意書」が開放されました！");
  } else if (event.data.type === 'reading-stage-return') exitReadingStage();
});

function startGokui() {
  initAudio();
  gameState.currentStageId = 'gokui';
  gameState.gokuiIndex = 0;
  gameState.endrollIndex = 0;
  gameState.gokuiUnlocked = true;
  // 極意書は選択画面の下部にあるため、開始時に表示位置を先頭へ戻す
  window.scrollTo(0, 0);
  saveData();
  render();
  requestAnimationFrame(() => window.scrollTo(0, 0));
}
function renderGokui() {
  const container = document.getElementById('main-content');
  const q = EIGO_SHORI_GOKUI_QUESTIONS[gameState.gokuiIndex];
  let html = `
    <div class="card">
      <div class="card-header">
        <span>★ 英語処理の極意書</span>
        <span style="font-size:0.8rem; color:#8b949e; cursor:pointer;" onclick="exitStage()">✕ 中断</span>
      </div>
      <div class="question-text">
        ${q.text.replace(/\n/g, '<br>')}
      </div>
      <div style="font-size:0.85rem; color:var(--gold-color); margin-bottom:10px;">
        正解すれば +20 EXP
      </div>
      <div class="options" id="gokui-opt-list">
  `;
  q.options.forEach((opt, idx) => {
    html += `<button class="btn" onclick="checkGokuiAnswer(${idx})">${opt.label}</button>`;
  });
  html += `
      </div>
      <div id="gokui-fb" class="feedback"></div>
    </div>
  `;
  container.innerHTML = html;
}
function checkGokuiAnswer(selectedIndex) {
  initAudio();
  const q = EIGO_SHORI_GOKUI_QUESTIONS[gameState.gokuiIndex];
  const selected = q.options[selectedIndex];
  const buttons = document.querySelectorAll('#gokui-opt-list .btn');
  const fbEl = document.getElementById('gokui-fb');
  if (selected.correct) {
    buttons.forEach(b => b.disabled = true);
    buttons[selectedIndex].classList.add('correct');
    const isFinalGokuiQuestion =
      gameState.gokuiIndex + 1 >= EIGO_SHORI_GOKUI_QUESTIONS.length;
    // 極意書の最終問題では、クリア音と紙吹雪をクリア表示より先に出す
    if (isFinalGokuiQuestion) {
      playSound('clear');
      triggerConfetti();
    } else {
      playSound('correct');
    }
    addExp(20);
    fbEl.className = "feedback active correct-fb";
    fbEl.innerHTML = isFinalGokuiQuestion
      ? "<strong>🏆 英語処理の極意書 CLEAR!</strong><br>全問クリア！"
      : "<strong>正解！ (+20 EXP)</strong>";
    setTimeout(() => {
      if (gameState.gokuiIndex + 1 < EIGO_SHORI_GOKUI_QUESTIONS.length) {
        gameState.gokuiIndex++;
        saveData();
        render();
      } else {
        // 極意書クリア後はステージ選択へ戻り、条件達成後にLAST BATTLEへ挑戦
        gameState.gokuiCleared = true;
        gameState.gokuiUnlocked = true;
        gameState.currentStageId = null;
        gameState.currentStep = 0;
        gameState.subStep = 0;
        gameState.bossSubStep = 0;
        gameState.lastBossIndex = 0;
        gameState.lastBossTimeLeft = 60;
        gameState.lastBossDialogActive = false;
        gameState.lastBossFailReason = "";
        gameState.endrollIndex = 0;
        gameState.isAllCleared = false;
        saveData();
        render();
        alert("「英語処理の極意書」CLEAR！\nランク42以上で LAST BATTLE「ヴァーバルアーチデーモン」に挑戦できます。");
      }
    }, 900);
  } else {
    playSound('wrong');
    buttons[selectedIndex].classList.add('wrong');
    fbEl.className = "feedback active wrong-fb";
    fbEl.innerHTML = "<strong>間違いです。もう一度</strong>";
    setTimeout(() => {
      buttons[selectedIndex].classList.remove('wrong');
      buttons[selectedIndex].disabled = false;
    }, 700);
  }
}

function startLastBoss() {
  if (!gameState.gokuiCleared || getRank(gameState.exp) < 42) {
    alert("LAST BATTLEの開放条件は「英語処理の極意書クリア」かつ「ランク42以上」です。");
    return;
  }
  initAudio();
  stopLastBossTimer();
  gameState.currentStageId = 'last_boss';
  gameState.lastBossIndex = 0;
  gameState.lastBossTimeLeft = 60;
  gameState.lastBossSkillActive = false;
  gameState.lastBossDialogActive = false;
  gameState.lastBossFailReason = "";
  gameState.isAllCleared = false;
  saveData();
  render();
  startLastBossTimer();
}
function startLastBossTimer() {
  stopLastBossTimer();
  lastBossTimer = setInterval(() => {
    if (gameState.currentStageId !== 'last_boss' || gameState.lastBossDialogActive) return;
    gameState.lastBossTimeLeft--;
    const timerEl = document.getElementById('last-boss-timer');
    if (timerEl) timerEl.textContent = `⏱️ 残り時間: ${gameState.lastBossTimeLeft}秒`;
    if (gameState.lastBossTimeLeft <= 0) {
      stopLastBossTimer();
      playSound('wrong');
      triggerLastBossFail("60秒経過！タイムオーバーです。");
    }
    saveData();
  }, 1000);
}
function stopLastBossTimer() {
  if (lastBossTimer) {
    clearInterval(lastBossTimer);
    lastBossTimer = null;
  }
}
function renderLastBoss() {
  const container = document.getElementById('main-content');
  const qData = LAST_BOSS_QUESTIONS[gameState.lastBossIndex];
  let html = `
    <div class="battle-scene">
      <div>
        <div class="pixel-char">⚔️</div>
        <div style="font-size:0.75rem; color:var(--accent-color); margin-top:4px;">プレーヤー</div>
      </div>
      <div style="font-size:1.2rem; color:#8b949e;">VS</div>
      <div>
        <div class="monster-char">👹</div>
        <div style="font-size:0.75rem; color:var(--danger-color); margin-top:4px;">ヴァーバルアーチデーモン</div>
      </div>
    </div>
    <div class="card boss-card">
      <div class="card-header">
        <span>🔥 LAST BOSS (Q${gameState.lastBossIndex + 1}/25)</span>
        <span style="font-size:0.8rem; color:#8b949e; cursor:pointer;" onclick="exitStage()">✕ 中断</span>
      </div>
      <div id="last-boss-timer" class="timer-display">⏱️ 残り時間: ${gameState.lastBossTimeLeft}秒</div>
  `;
  if (gameState.lastBossSkillActive) {
    html += `<div class="skill-comment-box">💡 判断の眼コメント: ${qData.comment}</div>`;
  }
  let formattedText = qData.text;
  if (gameState.lastBossSkillActive && qData.highlightText) {
    const terms = qData.highlightText.slice().sort((a,b) => b.length - a.length);
    const escapedTerms = terms.map(term => term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
    const regex = new RegExp(escapedTerms.map(term => `(${term})`).join('|'), 'gi');
    formattedText = formattedText.replace(regex, match => `<span class="highlight-red">${match}</span>`);
  }
  html += `<div class="question-text">${formattedText}</div>`;
  if (!gameState.lastBossDialogActive) {
    html += `<div class="options" id="last-boss-options">`;
    qData.options.forEach((opt, idx) => {
      html += `<button class="btn" onclick="checkLastBossAnswer(${idx})">${opt.label}</button>`;
    });
    html += `</div>`;
  } else {
    html += `
      <div class="dialog-overlay">
        <h3 style="color:var(--gold-color); margin-top:0;">クリア条件未達</h3>
        <p style="font-size:1.05rem;">${gameState.lastBossFailReason}</p>
        <p style="font-size:1.05rem;">★判断の眼（飛翔開眼）★を発動しますか？</p>
        <div class="dialog-btns">
          <button class="dialog-btn dialog-btn-yes" onclick="handleLastBossSkillDialog(true)">YES</button>
          <button class="dialog-btn dialog-btn-no" onclick="handleLastBossSkillDialog(false)">NO</button>
        </div>
      </div>
    `;
  }
  html += `</div>`;
  container.innerHTML = html;
}
function checkLastBossAnswer(selectedIndex) {
  initAudio();
  if (gameState.lastBossDialogActive) return;
  const qData = LAST_BOSS_QUESTIONS[gameState.lastBossIndex];
  const selected = qData.options[selectedIndex];
  if (!selected) return;
  if (!selected.correct) {
    playSound('wrong');
    triggerLastBossFail("不正解！1問目からリスタートです。");
    return;
  }
  playSound('correct');
  if (gameState.lastBossIndex + 1 < LAST_BOSS_QUESTIONS.length) {
    gameState.lastBossIndex++;
    saveData();
    render();
  } else {
    stopLastBossTimer();
    playSound('clear');
    triggerConfetti();
    gameState.lastBossCleared = true;
    gameState.endrollIndex = 0;
    gameState.currentStageId = 'endroll';
    gameState.isAllCleared = false;
    gameState.lastBossDialogActive = false;
    saveData();
    render();
  }
}
function triggerLastBossFail(reasonText) {
  stopLastBossTimer();
  gameState.lastBossDialogActive = true;
  gameState.lastBossFailReason = reasonText;
  saveData();
  render();
}
function handleLastBossSkillDialog(useSkill) {
  initAudio();
  gameState.lastBossSkillActive = useSkill;
  gameState.lastBossDialogActive = false;
  gameState.lastBossFailReason = "";
  gameState.lastBossIndex = 0;
  gameState.lastBossTimeLeft = 60;
  saveData();
  render();
  startLastBossTimer();
}

function renderEndroll() {
  const container = document.getElementById('main-content');
  const skills = gameState.unlockedSkills.slice();
  // これまで獲得したスキルをSTAGE順に並べる。
  const stageOrder = STAGES
    .filter(s => typeof s.id === 'number')
    .sort((a, b) => a.id - b.id)
    .map(s => s.rewardSkill);
  const orderedSkills = [];
  stageOrder.forEach(skill => {
    if (skills.includes(skill)) orderedSkills.push(skill);
  });
  // STAGE側に存在しない追加スキルは最後に残す。
  skills.forEach(skill => {
    if (!orderedSkills.includes(skill)) orderedSkills.push(skill);
  });
  const idx = gameState.endrollIndex;
  if (idx < orderedSkills.length) {
    const currentSkill = orderedSkills[idx];
    container.innerHTML = `
      <div class="endroll-card">
        <div style="color:var(--accent-color); font-size:0.9rem; margin-bottom:10px;">
          ★ 英語処理OS 獲得した判断の眼 ★
        </div>
        <div style="color:#8b949e; font-size:0.85rem;">
          ${idx + 1} / ${orderedSkills.length}
        </div>
        <div class="endroll-skill">
          【${currentSkill}】
        </div>
        <div style="color:#8b949e; font-size:0.8rem; margin-top:20px;">
          次の判断の眼へ……
        </div>
      </div>
    `;
    setTimeout(() => {
      // 画面遷移中に別操作されても進みすぎないよう現在値を確認
      if (gameState.currentStageId === 'endroll' &&
          gameState.endrollIndex === idx) {
        gameState.endrollIndex++;
        saveData();
        render();
      }
    }, 1400);
    return;
  }
  gameState.isAllCleared = true;
  saveData();
  container.innerHTML = `
    <div class="endroll-card endroll-final">
      <div class="trophy-icon">🏆✨</div>
      <h2 style="color:var(--gold-color); margin-top:0; font-size:1.35rem;">
        Congratulations!
      </h2>
      <p style="line-height:1.8; color:var(--text-color); margin:10px 0 25px;">
        英語処理OSマスターの称号を獲得！<br>
        さらなる高みを目指してトレーニングを続けていきましょう！
      </p>
      <button class="btn" style="text-align:center; background:var(--success-color);
        color:white; font-weight:bold; justify-content:center;"
        onclick="resetToStageSelect()">
        ★ ステージ選択に戻る / 復習する
      </button>
    </div>
  `;
}

  gameState.isAllCleared = false;

function exitStage() {
  stopLastBossTimer();
  if (confirm("ステージ選択画面に戻りますか？（進行状況は自動保存されます）")) {

document.addEventListener('click', initAudio, { once: true });
loadSaveData();

if (gameState.currentStageId === 'last_boss' && !gameState.lastBossDialogActive) startLastBossTimer();
