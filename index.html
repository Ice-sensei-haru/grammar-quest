<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英語処理OS RPG - Grammar Quest</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --text-color: #c9d1d9;
      --accent-color: #58a6ff;
      --success-color: #2ea043;
      --danger-color: #da3633;
      --gold-color: #d29922;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 15px;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    #app {
      width: 100%;
      max-width: 650px;
      background: var(--card-bg);
      border: 3px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 12px;
      margin-bottom: 15px;
    }

    .title {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--accent-color);
    }

    .player-stats {
      text-align: right;
    }

    .exp-bar-container {
      width: 140px;
      height: 12px;
      background: #21262d;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      margin-top: 4px;
    }

    .exp-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #238636, #2ea043);
      transition: width 0.3s ease;
    }

    .skills-container {
      background: #0d1117;
      border: 1px dashed var(--border-color);
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 0.85rem;
    }

    .skill-badge {
      display: inline-block;
      background: #232830;
      color: var(--gold-color);
      border: 1px solid var(--gold-color);
      padding: 2px 8px;
      border-radius: 4px;
      margin: 2px;
      font-weight: bold;
    }

    .card {
      background: #0d1117;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .card-header {
      font-weight: bold;
      color: var(--accent-color);
      margin-bottom: 10px;
      font-size: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .question-text {
      font-size: 1.1rem;
      margin-bottom: 15px;
      line-height: 1.5;
      color: #ffffff;
      background: #161b22;
      padding: 12px;
      border-radius: 6px;
      border-left: 4px solid var(--accent-color);
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      background: #21262d;
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 12px 15px;
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
      line-height: 1.4;
    }

    .btn:hover:not(:disabled) {
      background: #30363d;
      border-color: var(--accent-color);
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .btn.correct {
      background: #1b4721 !important;
      border-color: var(--success-color) !important;
      color: #ffffff;
    }

    .btn.wrong {
      background: #671618 !important;
      border-color: var(--danger-color) !important;
      color: #ffffff;
    }

    .feedback {
      margin-top: 15px;
      padding: 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      line-height: 1.4;
      display: none;
    }

    .feedback.active {
      display: block;
    }

    .feedback.wrong-fb {
      background: rgba(218, 54, 51, 0.15);
      border: 1px solid var(--danger-color);
      color: #ff7b72;
    }

    .feedback.correct-fb {
      background: rgba(46, 160, 67, 0.15);
      border: 1px solid var(--success-color);
      color: #56d364;
    }

    .boss-card {
      border: 2px solid var(--danger-color);
      background: linear-gradient(180deg, #200a0a 0%, #0d1117 100%);
    }

    .boss-header {
      color: var(--danger-color);
      font-weight: bold;
      text-align: center;
      font-size: 1.2rem;
      letter-spacing: 2px;
    }

    .reset-btn {
      background: transparent;
      color: #8b949e;
      border: 1px solid #30363d;
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
    }

    .reset-btn:hover {
      color: var(--danger-color);
      border-color: var(--danger-color);
    }

      background: #21262d;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 8px;
      width: 100%;
      text-align: left;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

      border-color: var(--accent-color);
    }

    .stage-select-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
  </style>
</head>

const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function playSound(type) {
  if (!audioCtx) audioCtx = new AudioContext();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  const now = audioCtx.currentTime;

  if (type === 'correct') {
    osc.frequency.setValueAtTime(523.25, now);
    osc.frequency.setValueAtTime(659.25, now + 0.1);
    gain.gain.setValueAtTime(0.1, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
    osc.start(now);
    osc.stop(now + 0.3);
  } else if (type === 'wrong') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(196.00, now);
    osc.frequency.setValueAtTime(146.83, now + 0.15);
    gain.gain.setValueAtTime(0.1, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
    osc.start(now);
    osc.stop(now + 0.35);
  } else if (type === 'clear') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(523.25, now);
    osc.frequency.setValueAtTime(659.25, now + 0.1);
    osc.frequency.setValueAtTime(783.99, now + 0.2);
    osc.frequency.setValueAtTime(1046.50, now + 0.3);
    gain.gain.setValueAtTime(0.1, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
    osc.start(now);
    osc.stop(now + 0.6);
  }
}

const STORAGE_KEY = 'grammar_quest_save_data_v1';
let gameState = {
  exp: 0,
  unlockedStage: 1,
  currentStageId: null,
  currentStep: 0,
  subStep: 0,
  unlockedSkills: []
};

function loadSaveData() {
  const data = localStorage.getItem(STORAGE_KEY);
  if (data) {
    try { gameState = JSON.parse(data); } catch(e) {}
  }
  updateHeader();
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(gameState));
  updateHeader();
}

function confirmResetData() {
  if (confirm("ゲームデータを初期化して最初から始めますか？")) {
    localStorage.removeItem(STORAGE_KEY);
    gameState = { exp: 0, unlockedStage: 1, currentStageId: null, currentStep: 0, subStep: 0, unlockedSkills: [] };
    saveData();
    render();
  }
}

function updateHeader() {
  document.getElementById('exp-display').textContent = gameState.exp;
  const percent = Math.min(100, Math.floor((gameState.exp / 500) * 100));
  document.getElementById('exp-bar').style.width = percent + '%';

  const skillContainer = document.getElementById('skills-list');
  if (gameState.unlockedSkills.length === 0) {
    skillContainer.innerHTML = '<span style="color: #484f58; font-size: 0.8rem;">まだスキルを獲得していません</span>';
  } else {
    skillContainer.innerHTML = gameState.unlockedSkills.map(s => `<span class="skill-badge">🛡️ ${s}</span>`).join('');
  }
}

function render() {
  if (gameState.currentStageId === null) {
    renderStageSelect();
  } else {
    renderQuestion();
  }
}

function renderStageSelect() {

    const isCleared = stg.id < gameState.unlockedStage;

      <button class="stage-select-btn" ${isUnlocked ? '' : 'disabled'} onclick="startStage(${stg.id})">
        <div>
          <strong>【${stg.title}】</strong> ${stg.skillName}
          ${isCleared ? ' <span style="color:var(--success-color); font-size:0.8rem;">[CLEAR]</span>' : ''}
        </div>
        <div>${isUnlocked ? '▶ 挑戦' : '🔒 鍵'}</div>
      </button>
    `;
  });

  html += '</div>';
  container.innerHTML = html;
}

function startStage(stageId) {
  gameState.currentStageId = stageId;
  gameState.currentStep = 0;
  gameState.subStep = 0;
  saveData();
  render();
}

function renderQuestion() {
  const container = document.getElementById('main-content');
  const stage = STAGES.find(s => s.id === gameState.currentStageId);
  const isBoss = gameState.currentStep === stage.questions.length;
  const qData = isBoss ? stage.boss : stage.questions[gameState.currentStep];

  let html = '';
  if (isBoss) {
    html += `<div class="card boss-card"><div class="boss-header">⚠️ BOSS BATTLE ⚠️</div>`;
  } else {
    html += `<div class="card"><div class="card-header"><span>${stage.title} - Q${gameState.currentStep + 1}/${stage.questions.length}</span><span style="font-size:0.8rem; color:#8b949e; cursor:pointer;" onclick="exitStage()">✕ 中断して戻る</span></div>`;
  }

  html += `<div class="question-text">${qData.text.replace(/\n/g, '<br>')}</div>`;

  if (gameState.subStep === 0) {
    html += `<div class="options" id="opt-list">`;
    qData.options.forEach((opt, idx) => {
      html += `<button class="btn" onclick="checkAnswer(${idx}, false)">${opt.label}</button>`;
    });
    html += `</div>`;
  } else {
    html += `<div style="margin-bottom:10px; font-weight:bold; color:var(--gold-color);">${qData.logicText}</div>`;
    html += `<div class="options" id="opt-list">`;
    qData.logicOptions.forEach((opt, idx) => {
      html += `<button class="btn" onclick="checkAnswer(${idx}, true)">${opt.label}</button>`;
    });
    html += `</div>`;
  }

  html += `<div id="fb" class="feedback"></div></div>`;
  container.innerHTML = html;
}

function checkAnswer(selectedIndex, isLogicStep) {
  const stage = STAGES.find(s => s.id === gameState.currentStageId);
  const isBoss = gameState.currentStep === stage.questions.length;
  const qData = isBoss ? stage.boss : stage.questions[gameState.currentStep];
  const targetOptions = isLogicStep ? qData.logicOptions : qData.options;
  const selected = targetOptions[selectedIndex];

  const fbEl = document.getElementById('fb');
  const buttons = document.querySelectorAll('#opt-list .btn');
  buttons.forEach(b => b.disabled = true);

  if (selected.correct) {
    playSound('correct');
    buttons[selectedIndex].classList.add('correct');

    if (!isLogicStep) {
      gameState.exp += 10;
      fbEl.className = "feedback active correct-fb";
      fbEl.innerHTML = "<strong>正解！ (+10 EXP)</strong><br>次に判断基準を選んでください。";
      setTimeout(() => {
        gameState.subStep = 1;
        saveData();
        render();
      }, 1200);
    } else {
      gameState.exp += 20;
      fbEl.className = "feedback active correct-fb";
      fbEl.innerHTML = "<strong>判断基準も正解！ (+20 EXP)</strong>";
      setTimeout(() => {
        if (isBoss) {
          playSound('clear');
          if (!gameState.unlockedSkills.includes(stage.rewardSkill)) {
            gameState.unlockedSkills.push(stage.rewardSkill);
          }
          if (gameState.unlockedStage === stage.id) {
            gameState.unlockedStage = stage.id + 1;
          }
          alert(`🎉 ${stage.title} CLEAR!\n獲得スキル: 【${stage.rewardSkill}】`);
          gameState.currentStageId = null;
          gameState.currentStep = 0;
          gameState.subStep = 0;
        } else {
          gameState.currentStep++;
          gameState.subStep = 0;
        }
        saveData();
        render();
      }, 1200);
    }
  } else {
    playSound('wrong');
    buttons[selectedIndex].classList.add('wrong');
    fbEl.className = "feedback active wrong-fb";
    fbEl.innerHTML = `<strong>不正解...</strong><br>${qData.wrongComment}`;
    setTimeout(() => {
      buttons.forEach(b => b.disabled = false);
    }, 1500);
  }
  saveData();
}

function exitStage() {
  if (confirm("ステージの選択画面に戻りますか？（進行状況は自動保存されます）")) {
    gameState.currentStageId = null;
    saveData();
    render();
  }
}

loadSaveData();
render();
</script>
</body>
</html>
