<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英語処理OS RPG - 基礎英文法クエスト</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --accent-gold: #f1e05a;
            --accent-blue: #58a6ff;
            --accent-green: #2ea043;
            --accent-red: #da3633;
            --text-main: #c9d1d9;
            --text-sub: #8b949e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 20px 10px;
            min-height: 100vh;
        }

        #app {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* ヘッダー・ステータスバー */
        .status-card {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .player-info {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent-gold);
        }

        .exp-container {
            width: 100%;
            background-color: #21262d;
            height: 16px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .exp-bar {
            height: 100%;
            background: linear-gradient(90deg, #2ea043, #3fb950);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* 保存・復元通知 */
        .save-banner {
            font-size: 0.8rem;
            color: var(--accent-blue);
            text-align: right;
            margin-top: 5px;
        }

        /* メイン画面・カード */
        .game-card {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .stage-title {
            font-size: 1.2rem;
            color: var(--accent-blue);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .skill-badge {
            font-size: 0.85rem;
            background-color: #21262d;
            color: var(--accent-gold);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }

        /* ボス戦アニメーション用 */
        .boss-container {
            text-align: center;
            padding: 10px;
            background-color: #271010;
            border: 2px solid var(--accent-red);
            border-radius: 8px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(218, 54, 51, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(218, 54, 51, 0); }
            100% { box-shadow: 0 0 0 0 rgba(218, 54, 51, 0); }
        }

        .question-box {
            font-size: 1.05rem;
            line-height: 1.6;
            background-color: #0d1117;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            white-space: pre-wrap;
        }

        .step-tag {
            display: inline-block;
            font-size: 0.8rem;
            background-color: var(--accent-blue);
            color: #000;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 3px;
            margin-bottom: 8px;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-option {
            background-color: #21262d;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 12px 15px;
            border-radius: 6px;
            font-size: 0.95rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            line-height: 1.4;
        }

        .btn-option:hover {
            background-color: #30363d;
            border-color: var(--accent-blue);
        }

        /* フィードバック表示 */
        .feedback-box {
            padding: 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            display: none;
            line-height: 1.5;
        }

        .feedback-box.correct {
            display: block;
            background-color: rgba(46, 160, 67, 0.2);
            border: 1px solid var(--accent-green);
            color: #56d364;
        }

        .feedback-box.wrong {
            display: block;
            background-color: rgba(218, 54, 51, 0.2);
            border: 1px solid var(--accent-red);
            color: #f85149;
        }

        .btn-next {
            background-color: var(--accent-green);
            color: white;
            font-weight: bold;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            display: none;
            text-align: center;
        }

        .btn-next:hover {
            background-color: #2c974b;
        }

        /* ステージ選択・マップ画面 */
        .stage-select-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .stage-node {
            background-color: #21262d;
            border: 2px solid var(--border-color);
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stage-node.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .stage-node.cleared {
            border-color: var(--accent-green);
        }

        .reset-btn {
            background-color: transparent;
            color: var(--text-sub);
            border: 1px solid var(--border-color);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            margin-top: 10px;
        }

        .reset-btn:hover {
            color: var(--accent-red);
            border-color: var(--accent-red);
        }
    </style>
</head>

// --- Web Audio API 効果音設定 ---
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function playSound(type) {
  if (!audioCtx) audioCtx = new AudioContext();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);

  const now = audioCtx.currentTime;
  if (type === 'correct') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(523.25, now); // C5
    osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
    osc.start(now);
    osc.stop(now + 0.3);
  } else if (type === 'wrong') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(196.00, now); // G3
    osc.frequency.setValueAtTime(146.83, now + 0.15); // D3
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
    osc.start(now);
    osc.stop(now + 0.35);
  } else if (type === 'clear') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(523.25, now);
    osc.frequency.setValueAtTime(659.25, now + 0.1);
    osc.frequency.setValueAtTime(783.99, now + 0.2);
    osc.frequency.setValueAtTime(1046.50, now + 0.3);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
    osc.start(now);
    osc.stop(now + 0.6);
  }
}

}

// データの保存
function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(gameState));
  updateHeader();
}

// セーブ初期化
function confirmResetData() {
  if (confirm("ゲームデータを初期化して最初から始めますか？")) {
    localStorage.removeItem(STORAGE_KEY);
    gameState = {
      exp: 0,
      unlockedStage: 1,
      currentStageId: null,
      currentStep: 0,
      subStep: 0,
      unlockedSkills: []
    };
    saveData();
    renderStageSelect();
  }
}
