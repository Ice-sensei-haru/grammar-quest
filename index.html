<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英語処理OS RPG - Grammar Quest</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --text-color: #c9d1d9;
      --accent-color: #58a6ff;
      --success-color: #2ea043;
      --danger-color: #da3633;
      --gold-color: #d29922;
      --purple-color: #a371f7;
    }
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      margin: 0;
      padding: 15px;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    #app {
      width: 100%;
      max-width: 650px;
      background: var(--card-bg);
      border: 3px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 12px;
      margin-bottom: 15px;
    }
    .title {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--accent-color);
    }
    .player-stats {
      text-align: right;
    }
    .exp-bar-container {
      width: 140px;
      height: 12px;
      background: #21262d;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      margin-top: 4px;
    }
    .exp-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #238636, #2ea043);
      transition: width 0.3s ease;
    }
    .skills-container {
      background: #0d1117;
      border: 1px dashed var(--border-color);
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 0.85rem;
    }
    .skill-badge {
      display: inline-block;
      background: #232830;
      color: var(--gold-color);
      border: 1px solid var(--gold-color);
      padding: 2px 8px;
      border-radius: 4px;
      margin: 2px;
      font-weight: bold;
    }
    .card {
      background: #0d1117;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
    }
    .card-header {
      font-weight: bold;
      color: var(--accent-color);
      margin-bottom: 10px;
      font-size: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .question-text {
      font-size: 1.1rem;
      margin-bottom: 15px;
      line-height: 1.5;
      color: #ffffff;
      background: #161b22;
      padding: 12px;
      border-radius: 6px;
      border-left: 4px solid var(--accent-color);
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn {
      background: #21262d;
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 12px 15px;
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
      line-height: 1.4;
    }
    .btn:hover:not(:disabled) {
      background: #30363d;
      border-color: var(--accent-color);
    }
    .btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }
    .btn.correct {
      background: #1b4721 !important;
      border-color: var(--success-color) !important;
      color: #ffffff;
    }
    .btn.wrong {
      background: #671618 !important;
      border-color: var(--danger-color) !important;
      color: #ffffff;
    }
    .feedback {
      margin-top: 15px;
      padding: 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      line-height: 1.4;
      display: none;
    }
    .feedback.active {
      display: block;
    }
    .feedback.wrong-fb {
      background: rgba(218, 54, 51, 0.15);
      border: 1px solid var(--danger-color);
      color: #ff7b72;
    }
    .feedback.correct-fb {
      background: rgba(46, 160, 67, 0.15);
      border: 1px solid var(--success-color);
      color: #56d364;
    }
    .boss-card {
      border: 2px solid var(--danger-color);
      background: linear-gradient(180deg, #200a0a 0%, #0d1117 100%);
    }
    .boss-header {
      color: var(--danger-color);
      font-weight: bold;
      text-align: center;
      font-size: 1.2rem;
      letter-spacing: 2px;
    }
    .reset-btn {
      background: transparent;
      color: #8b949e;
      border: 1px solid #30363d;
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
    }
    .reset-btn:hover {
      color: var(--danger-color);
      border-color: var(--danger-color);
    }
    .stage-select-btn {
      background: #21262d;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 8px;
      width: 100%;
      text-align: left;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .stage-select-btn:hover:not(:disabled) {
      border-color: var(--accent-color);
    }
    .stage-select-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .stage-select-btn.extra-stage-btn {
      border-color: var(--purple-color);
      background: linear-gradient(135deg, #181124 0%, #21262d 100%);
    }
    .stage-select-btn.extra-stage-btn:hover:not(:disabled) {
      border-color: #c084fc;
    }
    .battle-scene {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: #090d12;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      text-align: center;
    }
    .pixel-char {
      font-size: 2.5rem;
      animation: floatChar 2s ease-in-out infinite;
    }
    @keyframes floatChar {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    .monster-char {
      font-size: 2.5rem;
      animation: pulseMonster 1.5s ease-in-out infinite;
    }
    @keyframes pulseMonster {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    .all-clear-card {
      text-align: center;
      padding: 30px 20px;
      background: linear-gradient(135deg, #161b22 0%, #1f2633 100%);
      border: 2px solid var(--gold-color);
      border-radius: 12px;
    }
    .trophy-icon {
      font-size: 4rem;
      margin-bottom: 15px;
      animation: bounceTrophy 1s ease-in-out infinite alternate;
    }
    @keyframes bounceTrophy {
      0% { transform: translateY(0); }
      100% { transform: translateY(-10px); }
    }
    /* 並べ替えUI専用スタイル */
    .word-pool, .word-answer-box {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 48px;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 12px;
    }
    .word-answer-box {
      background: #161b22;
      border: 2px dashed var(--accent-color);
      align-items: center;
    }
    .word-pool {
      background: #0d1117;
      border: 1px solid var(--border-color);
    }
    .word-chip {
      background: #21262d;
      color: #ffffff;
      border: 1px solid var(--accent-color);
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .word-chip:hover {
      background: var(--accent-color);
      color: #0d1117;
      font-weight: bold;
    }
    .sort-action-btn {
      background: var(--success-color);
      color: #ffffff;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .sort-action-btn:disabled {
      background: #30363d;
      cursor: not-allowed;
      opacity: 0.6;
    }
  </style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="title">⚔ 英語処理OS RPG</div>
    <div class="player-stats">
      <div style="font-size: 0.85rem;">ランク: <span id="rank-display" style="color:var(--gold-color); font-weight:bold;">1</span> (EXP: <span id="exp-display">0</span>)</div>
      <div class="exp-bar-container">
        <div id="exp-bar" class="exp-bar"></div>
      </div>
      <div style="font-size:0.7rem; color:#8b949e; margin-top:2px;">💾 進捗は自動保存されます</div>
    </div>
  </div>
  <div class="skills-container">
    <div style="font-size: 0.75rem; color: #8b949e; margin-bottom: 4px; display:flex; justify-content:space-between; align-items:center;">
      <span>獲得スキル (<span id="skill-count">0</span>個)</span>
      <button class="reset-btn" onclick="confirmResetData()">データ削除</button>
    </div>
    <div id="skills-list">
      <span style="color: #484f58; font-size: 0.8rem;">まだスキルを獲得していません</span>
    </div>
  </div>
  <div id="main-content"></div>
</div>
<script>
const STAGES = [
  {
    id: 1,
    title: "STAGE 1",
    skillName: "基礎認識",
    rewardSkill: "基礎認識スキル",
    monsterEmoji: "👾",
    monsterName: "エラー・スライム",
    questions: [
      {
        text: "① Tom and Ken play tennis. の主語と動詞はどれ？",
        options: [
          { label: "A : 主語 Tom 動詞 play", correct: false },
          { label: "B : 主語 Tom and Ken 動詞 play", correct: true },
          { label: "C : 主語 Ken 動詞 play", correct: false }
        ],
        wrongComment: "主語は「だれが」にあたる名詞のまとまり全体で見ます。",
        logicText: "【判断基準】",
        logicOptions: [
          { label: "主語は文頭の名詞のまとまり", correct: true },
          { label: "主語は文頭の単語", correct: false }
        ]
      },
      {
        text: "② Tom likes dogs. の疑問文とその答え方は？",
        options: [
          { label: "A : Is Tom like dogs? – Yes, he is.", correct: false },
          { label: "B : Do Tom likes dogs? – Yes, he do.", correct: false },
          { label: "C : Does Tom like dogs? – Yes, he does.", correct: true }
        ],
        wrongComment: "一般動詞の文で主語が三人称単数のときはDoesを使い、動詞は原形に戻します。",
        logicText: "【判断基準】",
        logicOptions: [
          { label: "一般動詞の形が三単現のs → Doesを使って動詞を原形に戻す", correct: true },
          { label: "主語が１語 → Doesを使って動詞を原形に戻す", correct: false }
        ]
      },
      {
        text: "③ Tom can play the guitar. の( the guitar )をたずねる疑問文は？",
        options: [
          { label: "A : What can Tom play?", correct: true },
          { label: "B : What Tom can play?", correct: false },
          { label: "C : What does Tom play?", correct: false }
        ],
        wrongComment: "助動詞canがある文の疑問文は、canを主語の前に出します。",
        logicText: "【判断基準】",
        logicOptions: [
          { label: "疑問詞の後にcanを置く", correct: false },
          { label: "疑問詞を文頭に、canを主語の前に出す", correct: true }
        ]
      }
    ],
    boss: {
      text: "【BOSS BATTLE】\nTom went fishing last Sunday. の( last Sunday )をたずねる疑問文にしなさい。",
      options: [
        { label: "A : When was Tom go fishing?", correct: false },
        { label: "B : When did Tom go fishing?", correct: true },
        { label: "C : When does Tom went fishing?", correct: false }
      ],
      wrongComment: "一般動詞の過去形なのでdidを使い、動詞は原形に戻します。",
      logicText: "【判断基準】",
      logicOptions: [
        { label: "lastが過去を表すのでdidを使う", correct: false },
        { label: "一般動詞が過去形なのでdidを使う", correct: true }
      ]
    }
  },
  {
    id: 2,
    title: "STAGE 2",
    skillName: "S-V発見",
    rewardSkill: "S-V発見スキル",
    monsterEmoji: "🐉",
    monsterName: "フェイク・キマイラ",
    questions: [
      {
        text: "① Your brother is a soccer fan. の疑問文とその答え方は？",
        options: [
          { label: "A : Are your brother a soccer fan? – Yes, I am.", correct: false },
          { label: "B : Is your brother a soccer fan? – Yes, it is.", correct: false },
          { label: "C : Is your brother a soccer fan? – Yes, he is.", correct: true }
        ],
        wrongComment: "be動詞を前に出し、答えの文の代名詞は主語に合わせます。",
        logicText: "【判断基準】",
        logicOptions: [
          { label: "be動詞を主語の前に出す。答える文の主語は疑問文に合わせる", correct: true },
          { label: "主語が単数だからisを主語の前に出す。答える文は人ならheを使う", correct: false }
        ]
      },
      {
        text: "② Tom and Ken play soccer. の主語をTomだけにすると？",
        options: [
          { label: "A : Tom play soccer.", correct: false },
          { label: "B : Tom plays soccer.", correct: true },
          { label: "C : Tom is play soccer.", correct: false }
        ],
        wrongComment: "主語が三人称単数になると、一般動詞にs/esが付きます。",
        logicText: "【判断基準】",
        logicOptions: [
          { label: "主語が三人称単数だから一般動詞は三単現のsがつく", correct: true },
          { label: "主語が１語になると一般動詞は三単現のsがつく", correct: false }
        ]
      },
      {
        text: "③ I am a tennis fan. のIをWeに変えると？",
        options: [
          { label: "A : We are tennis fans.", correct: true },
          { label: "B : We are a tennis fan.", correct: false },
          { label: "C : We are a tennis fans.", correct: false }
        ],
        wrongComment: "主語が複数になるとbe動詞はareになり、後ろの名詞も複数形になります。",
        logicText: "【判断基準】",
        logicOptions: [
          { label: "主語が複数になれば、複数形を使う", correct: false },
          { label: "be動詞の後ろの名詞の数は主語に合わす", correct: true }
        ]
      }
    ],
    boss: {
      text: "【BOSS BATTLE】\nThey always watch soccer games. のTheyをHeに変えると？",
      options: [
        { label: "A : He always watch a soccer game.", correct: false },
        { label: "B : He always watches soccer games.", correct: true },
        { label: "C : He always watches a soccer game.", correct: false }
      ],
      wrongComment: "主語がHe（三人称単数）に変わるため、動詞も三単現のsが必要です。",
      logicText: "【判断基準】",
      logicOptions: [
        { label: "主語が１語になると一般動詞に三単現のsがつく", correct: false },
        { label: "主語が三人称単数になったので、一般動詞に三単現のsがつく", correct: true }
      ]
    }
  },
  {
    id: 3,
    title: "STAGE 3",
    skillName: "主語変換",
    rewardSkill: "主語変換スキル",
    monsterEmoji: "🤖",
    monsterName: "シンタックス・ゴーレム",
    questions: [
      {
        text: "① Those are old bikes. のThoseをThatに変えると？",
        options: [
          { label: "A : That are old bikes.", correct: false },
          { label: "B : That is an old bike.", correct: true },
          { label: "C : That is old bike.", correct: false }
        ],
        wrongComment: "Thatは単数なのでisになり、後ろの名詞も単数形（an old bike）になります。",
        logicText: "【判断基準】",
        logicOptions: [
          { label: "三人称単数の主語にはbe動詞をisにし、後ろはa(an)＋どんな＋単数形", correct: true },
          { label: "後ろの名詞が単数になるとbe動詞はisを使う", correct: false }
        ]
      },
      {
        text: "② Tom and Lisa don’t swim. の主語をTomだけにすると？",
        options: [
          { label: "A : Tom don’t swims.", correct: false },
          { label: "B : Tom doesn’t swim.", correct: true },
          { label: "C : Tom is not swim.", correct: false }
        ],
        wrongComment: "主語が三人称単数の否定文では doesn't を使い、動詞は原形にします。",
        logicText: "【判断基準】",
        logicOptions: [
          { label: "主語が１語になると一般動詞の否定文にはdoesを使う", correct: false },
          { label: "主語が三人称単数だから一般動詞の否定文にはdoesを使う", correct: true }
        ]
      },
      {
        text: "③ The man from India speaks English. を疑問文に変えると？",
        options: [
          { label: "A : Do the man from India speak English?", correct: false },
          { label: "B : Can the man from India speak English?", correct: false },
          { label: "C : Does the man from India speak English?", correct: true }
        ],
        wrongComment: "主語は the man（三人称単数）、動詞が speaks なので Does を使います。",
        logicText: "【判断基準】",
        logicOptions: [
          { label: "主語がIndia、動詞がspeakなのでdoesを使う", correct: false },
          { label: "主語がthe man、動詞がspeakなのでdoesを使う", correct: true }
        ]
      }
    ],
    boss: {
      text: "【BOSS BATTLE】\nThey are interesting stories. のTheyをItに変えると？",
      options: [
        { label: "A : It is interesting story.", correct: false },
        { label: "B : It are interesting stories.", correct: false },
        { label: "C : It is an interesting story.", correct: true }
      ],
      wrongComment: "Itは単数なので is になり、storyの前には an が必要です。",
      logicText: "【判断基準】",
      logicOptions: [
        { label: "後ろの名詞が単数形になると、be動詞はisを使う", correct: false },
        { label: "三人称単数の主語にはbe動詞をisにし、後ろの名詞も単数形にする", correct: true }
      ]
    }
  },
  {
    id: 4,
    title: "STAGE 4",
    skillName: "動詞形選択",
    rewardSkill: "動詞形選択スキル",
    monsterEmoji: "👑",
    monsterName: "カオス・クラウン",
    questions: [
      {
        text: "① Where are they (  ) soccer now? の(  )に適する語は？",
        options: [
          { label: "A : play", correct: false },
          { label: "B : plays", correct: false },
          { label: "C : playing", correct: true }
        ],
        wrongComment: "nowとbe動詞（are）があるため、現在進行形（-ing）にします。",
        logicText: "【判断基準】",
        logicOptions: [
          { label: "文末にnowがあるので一般動詞をingの形にする", correct: false },
          { label: "be動詞があるので一般動詞をingの形にする", correct: true }
        ]
      },
      {
        text: "② He (  ) not swimming now . の(  )に適する語は？",
        options: [
          { label: "A : is", correct: true },
          { label: "B : does", correct: false },
          { label: "C : was", correct: false }
        ],
        wrongComment: "swimming（-ing）とnowがあるので、be動詞（is）を選びます。",
        logicText: "【判断基準】",
        logicOptions: [
          { label: "現在でswimmingがあるのでisを使う", correct: true },
          { label: "主語がHeのときはisを使う", correct: false }
        ]
      },
      {
        text: "③ 「トムはネコを飼っています。」 の正しい英語表現は？",
        options: [
          { label: "A : Tom having a cat.", correct: false },
          { label: "B : Tom is having a cat.", correct: false },
          { label: "C : Tom has a cat.", correct: true }
        ],
        wrongComment: "「飼っている（状態）」は進行形にできません。",
        logicText: "【判断基準】",
        logicOptions: [
          { label: "「飼っている」は状態を表し、進行形にしない", correct: true },
          { label: "一般動詞haveは進行形にできない", correct: false }
        ]
      }
    ],
    boss: {
      text: "【BOSS BATTLE】\nDo they cut the trees? を現在進行形の文にすると？",
      options: [
        { label: "A : Are they cut the trees?", correct: false },
        { label: "B : Are they cutting the trees?", correct: true },
        { label: "C : Do they cutting the trees?", correct: false }
      ],
      wrongComment: "現在進行形の疑問文はbe動詞を主語の前に出し、一般動詞に -ing をつけます。",
      logicText: "【判断基準】",
      logicOptions: [
        { label: "Doを使わないので一般動詞をingの形にする", correct: false },
        { label: "現在進行形はbe動詞を主語で決め、一般動詞をingの形にする", correct: true }
      ]
    }
  },
  {
    id: 5,
    title: "STAGE 5",
    skillName: "代名詞判断",
    rewardSkill: "代名詞判断スキル",
    monsterEmoji: "🛡️",
    monsterName: "キラー・ナイト",
    questions: [
      {
        text: "① Do you and Ken play tennis? – Yes, (  ) do. の(  )に入る適切な語は？",
        options: [

let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (AudioContext) {
      audioCtx = new AudioContext();
    }
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}
function playSound(type) {
  initAudio();
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  if (type === 'correct') {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(523.25, now);
    osc.frequency.setValueAtTime(659.25, now + 0.1);
    gain.gain.setValueAtTime(0.1, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
    osc.start(now);
    osc.stop(now + 0.3);
  } else if (type === 'wrong') {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(196.00, now);
    osc.frequency.setValueAtTime(146.83, now + 0.15);
    gain.gain.setValueAtTime(0.1, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
    osc.start(now);
    osc.stop(now + 0.35);
  } else if (type === 'levelup') {
    const notes = [
      { freq: 440.00, dur: 0.1 },
      { freq: 554.37, dur: 0.1 },
      { freq: 659.25, dur: 0.1 },
      { freq: 880.00, dur: 0.35 }
    ];
    let startTime = now;
    notes.forEach(note => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'square';
      osc.frequency.setValueAtTime(note.freq, startTime);
      gain.gain.setValueAtTime(0.12, startTime);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + note.dur);
      osc.start(startTime);
      osc.stop(startTime + note.dur);
      startTime += note.dur;
    });
  } else if (type === 'clear') {
    const notes = [
      { freq: 523.25, dur: 0.12 },
      { freq: 659.25, dur: 0.12 },
      { freq: 783.99, dur: 0.12 },
      { freq: 1046.50, dur: 0.4 }
    ];
    let startTime = now;
    notes.forEach(note => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(note.freq, startTime);
      gain.gain.setValueAtTime(0.15, startTime);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + note.dur);
      osc.start(startTime);
      osc.stop(startTime + note.dur);
      startTime += note.dur;
    });
  }
}

    confetti({

      spread: 90,
      origin: { y: 0.6 }
    });

const STORAGE_KEY = 'grammar_quest_save_data_v6';
let gameState = {
  exp: 0,
  unlockedStage: 1,
  currentStageId: null,
  currentStep: 0,
  subStep: 0,
  bossSubStep: 0,
  selectedWords: [],
  unlockedSkills: [],
  isAllCleared: false
};
function loadSaveData() {
  const data = localStorage.getItem(STORAGE_KEY);
  if (data) {
    try { gameState = JSON.parse(data); } catch(e) {}
  }
  if (gameState.bossSubStep === undefined) gameState.bossSubStep = 0;
  if (!gameState.selectedWords) gameState.selectedWords = [];
  updateHeader();
}
function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(gameState));
  updateHeader();
}
function confirmResetData() {
  if (confirm("ゲームデータを初期化して最初から始めますか？")) {
    localStorage.removeItem(STORAGE_KEY);
    gameState = { exp: 0, unlockedStage: 1, currentStageId: null, currentStep: 0, subStep: 0, bossSubStep: 0, selectedWords: [], unlockedSkills: [], isAllCleared: false };
    saveData();
    render();
  }
}
function addExp(amount) {
  const oldRank = Math.floor(gameState.exp / 100) + 1;
  gameState.exp += amount;
  const newRank = Math.floor(gameState.exp / 100) + 1;
  if (newRank > oldRank) {
    playSound('levelup');
  }
}
function getRank(exp) {
  return Math.floor(exp / 100) + 1;
}
function updateHeader() {
  const rank = getRank(gameState.exp);
  document.getElementById('rank-display').textContent = rank;
  document.getElementById('exp-display').textContent = gameState.exp;
  
  const currentLevelExp = gameState.exp % 100;
  document.getElementById('exp-bar').style.width = currentLevelExp + '%';
  const skillContainer = document.getElementById('skills-list');
  document.getElementById('skill-count').textContent = gameState.unlockedSkills.length;
  
  if (gameState.unlockedSkills.length === 0) {
    skillContainer.innerHTML = '<span style="color: #484f58; font-size: 0.8rem;">まだスキルを獲得していません</span>';
  } else {
    skillContainer.innerHTML = gameState.unlockedSkills.map(s => `<span class="skill-badge">🛡 ${s}</span>`).join('');
  }
}
function render() {
  if (gameState.isAllCleared) {
    renderAllClear();
  } else if (gameState.currentStageId === null) {
    renderStageSelect();
  } else {
    renderQuestion();
  }
}
function renderStageSelect() {
  const container = document.getElementById('main-content');
  let html = '<div class="card"><div class="card-header">🗺️ ステージを選択して挑戦</div>';
  STAGES.forEach(stg => {
    let isUnlocked = false;
    let isCleared = false;

    if (stg.isExtra) {
      isUnlocked = gameState.exp >= (stg.requiredExp || 1300);
      isCleared = gameState.unlockedSkills.includes(stg.rewardSkill);
    } else {
      isUnlocked = stg.id <= gameState.unlockedStage;
      isCleared = stg.id < gameState.unlockedStage;
    }

    const extraClass = stg.isExtra ? ' extra-stage-btn' : '';
    
    html += `
      <button class="stage-select-btn${extraClass}" ${isUnlocked ? '' : 'disabled'} onclick="startStage('${stg.id}')">
        <div>
          <strong>【${stg.title}】</strong> ${stg.skillName} 
          <div style="font-size:0.75rem; color:#8b949e; margin-top:2px;">出現ボス: ${stg.monsterEmoji} ${stg.monsterName}</div>
          ${stg.isExtra && !isUnlocked ? `<div style="font-size:0.75rem; color:var(--purple-color); margin-top:2px;">🔒 開放条件: 必要EXP ${stg.requiredExp} (現在: ${gameState.exp})</div>` : ''}

  html += '</div>';

    qData.words.forEach((w, idx) => {
      const isUsed = gameState.selectedWords.some(item => item.origIdx === idx);
      if (!isUsed) {
        html += `<span class="word-chip" onclick="selectWord('${w.replace(/'/g, "\\'")}', ${idx})">${w}</span>`;
      }

    html += `</div>`;

  } else if (gameState.subStep === 0) {

function selectWord(word, origIdx) {
  initAudio();
  gameState.selectedWords.push({ word: word, origIdx: origIdx });
  saveData();
  render();
}
function unselectWord(idx) {
  initAudio();
  gameState.selectedWords.splice(idx, 1);

function checkSortAnswer() {
  initAudio();
  const stage = STAGES.find(s => s.id === gameState.currentStageId);
  const isBoss = gameState.currentStep === stage.questions.length;
  let qData = isBoss ? stage.boss.questions[gameState.bossSubStep] : stage.questions[gameState.currentStep];
  const fbEl = document.getElementById('fb');
  const userSentence = gameState.selectedWords.map(w => w.word).join(' ');
  const normalize = (str) => {
    return str.trim()
      .replace(/[.? !]$/, '')
      .toLowerCase();
  };
  const isCorrect = normalize(userSentence) === normalize(qData.correctAnswer);
  if (isCorrect) {
    playSound('correct');
    addExp(10);
    fbEl.className = "feedback active correct-fb";
    fbEl.innerHTML = "<strong>並べかえ正解！ (+10 EXP)</strong><br>続いて「判断基準」を選んでください。";
    setTimeout(() => {
      gameState.subStep = 1;
      saveData();
      render();
    }, 1200);
  } else {
    playSound('wrong');
    fbEl.className = "feedback active wrong-fb";
    fbEl.innerHTML = `<strong>不正解...</strong><br>${qData.wrongComment}`;
  }

function checkAnswer(selectedIndex, isLogicStep) {
  initAudio();
  const stage = STAGES.find(s => s.id === gameState.currentStageId);
  const isBoss = gameState.currentStep === stage.questions.length;
  let qData;
  let totalBossQuestions = 1;
  if (isBoss) {
    if (stage.boss.type === "normal" || stage.boss.type === "sort") {
      qData = stage.boss.questions[gameState.bossSubStep];
      totalBossQuestions = stage.boss.questions.length;
    } else {
      qData = stage.boss;
    }
  } else {
    qData = stage.questions[gameState.currentStep];
  }
  const targetOptions = isLogicStep ? qData.logicOptions : qData.options;
  const selected = targetOptions[selectedIndex];
  const fbEl = document.getElementById('fb');
  const buttons = document.querySelectorAll('#opt-list .btn');
  buttons.forEach(b => b.disabled = true);
  if (selected.correct) {
    buttons[selectedIndex].classList.add('correct');
    if (!isLogicStep) {
      playSound('correct');
      addExp(10);
      fbEl.className = "feedback active correct-fb";
      fbEl.innerHTML = "<strong>正解！ (+10 EXP)</strong><br>続いて「判断基準」を選んでください。";
      setTimeout(() => {
        gameState.subStep = 1;
        saveData();
        render();
      }, 1200);
    } else {
      if (isBoss) {
        if (gameState.bossSubStep + 1 < totalBossQuestions) {
          playSound('correct');
          addExp(20);
          fbEl.className = "feedback active correct-fb";
          fbEl.innerHTML = "<strong>判断基準も正解！ (+20 EXP)</strong><br>次のボス問題へ！";
          setTimeout(() => {
            gameState.bossSubStep++;
            gameState.subStep = 0;
            gameState.selectedWords = [];
            saveData();
            render();
          }, 1200);
        } else {
          playSound('clear');
          triggerConfetti();
          addExp(20);
          fbEl.className = "feedback active correct-fb";
          fbEl.innerHTML = `<strong>🏆 BOSS K.O.!! (+20 EXP)</strong><br>【${stage.rewardSkill}】を獲得しました！`;
          setTimeout(() => {
            if (!gameState.unlockedSkills.includes(stage.rewardSkill)) {
              gameState.unlockedSkills.push(stage.rewardSkill);
            }
            if (!stage.isExtra && gameState.unlockedStage === stage.id) {
              gameState.unlockedStage = stage.id + 1;
            }
            if (stage.id === 9 && !gameState.unlockedSkills.includes("処理手順化スキル")) { // STAGE9クリア時の全クリア演出
              gameState.isAllCleared = true;
              saveData();
              render();
              triggerConfetti();
              setTimeout(triggerConfetti, 500);
              setTimeout(triggerConfetti, 1000);

              alert(`🎉 ${stage.title} CLEAR!\n獲得スキル: 【${stage.rewardSkill}】`);
              gameState.currentStageId = null;
              gameState.currentStep = 0;
              gameState.subStep = 0;
              gameState.bossSubStep = 0;
              gameState.selectedWords = [];
              saveData();
              render();
            }
          }, 1500);
        }
      } else {
        playSound('correct');
        addExp(20);
        fbEl.className = "feedback active correct-fb";
        fbEl.innerHTML = "<strong>判断基準も正解！ (+20 EXP)</strong>";
        setTimeout(() => {
          gameState.currentStep++;
          gameState.subStep = 0;
          gameState.selectedWords = [];
          saveData();
          render();
        }, 1200);
      }
    }
  } else {
    playSound('wrong');
    buttons[selectedIndex].classList.add('wrong');
    fbEl.className = "feedback active wrong-fb";
    fbEl.innerHTML = `<strong>不正解...</strong><br>${qData.wrongComment}`;
    setTimeout(() => {

  saveData();
}

}
function exitStage() {
  if (confirm("ステージ選択画面に戻りますか？（進行状況は自動保存されます）")) {
    gameState.currentStageId = null;
    saveData();
    render();
  }
}
document.addEventListener('click', initAudio, { once: true });
loadSaveData();
render();
</script>
